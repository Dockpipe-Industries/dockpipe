name: Go compatibility SDK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reproduced SDK after release environment approval.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dockpipe-go-sdk
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.lock.outputs.source_commit }}
      tag: ${{ steps.lock.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Read the committed SDK source lock
        id: lock
        run: python3 workflows/shared/launch.py workflows/build/go-sdk/inspect.yml -- --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: a71e5db1026a478ea4dfbcbee9f2c884c9c2f61d
          path: build/sdk-source
          persist-credentials: false
      - name: Verify locked SDK producer and publisher
        run: python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml -- --suite workflows/build/go-sdk/tests --suite workflows/publish/go-sdk/tests --suite workflows/publish/shared/tests
      - name: Install the separate locked workflow bootstrap
        run: python3 workflows/shared/bootstrap.py --output "$RUNNER_TEMP/dockpipe-bootstrap"
      - name: Reproduce the exact SDK archive and manifest
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          "$DOCKPIPE_BOOTSTRAP_BIN" --workflow-file workflows/build/go-sdk/locked.yml --workdir "$GITHUB_WORKSPACE" -- --source-root build/sdk-source --output "$RUNNER_TEMP/go-sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: dockpipe-go-sdk
          path: ${{ runner.temp }}/go-sdk/
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dockpipe-go-sdk
          path: sdk-artifacts
      - name: Publish the immutable SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ needs.reproduce.outputs.tag }}
          SDK_COMMIT: ${{ needs.reproduce.outputs.source_commit }}
        run: python3 workflows/shared/launch.py workflows/publish/go-sdk/config.yml -- --directory sdk-artifacts
