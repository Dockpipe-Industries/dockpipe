name: Pipeon desktop qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, staging, master]
    paths:
      - .github/workflows/pipeon-desktop.yml
      - packages/pipeon/apps/pipeon-desktop/**
      - packages/pipeon/assets/scripts/build.sh
      - packages/pipeon/assets/scripts/build-desktop-windows.ps1
  push:
    branches: [dev, staging, master]
    paths:
      - .github/workflows/pipeon-desktop.yml
      - packages/pipeon/apps/pipeon-desktop/**
      - packages/pipeon/assets/scripts/build.sh
      - packages/pipeon/assets/scripts/build-desktop-windows.ps1

permissions:
  contents: read

concurrency:
  group: pipeon-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Pipeon desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Build locked Pipeon desktop
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pipeon-desktop-target
        run: cargo +1.95.0 build --locked --manifest-path packages/pipeon/apps/pipeon-desktop/src-tauri/Cargo.toml
      - name: Test clipboard origin isolation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pipeon-desktop-target
        run: cargo +1.95.0 test --locked --manifest-path packages/pipeon/apps/pipeon-desktop/src-tauri/Cargo.toml --test clipboard_access
