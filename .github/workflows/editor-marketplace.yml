name: Editor candidate and Marketplace
on:
  push:
    branches: [dev, staging, master]
    paths: ['tooling/vscode-extensions/**', 'workflows/editor*/**', 'workflows/shared/**', 'src/lib/infrastructure/schema/**', '.github/workflows/editor-marketplace.yml']
  pull_request:
    paths: ['tooling/vscode-extensions/**', 'workflows/editor*/**', 'workflows/shared/**', 'src/lib/infrastructure/schema/**', '.github/workflows/editor-marketplace.yml']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run containing the reviewed VSIX
        required: true
        type: string
      version:
        description: Exact reviewed extension version
        required: true
        type: string
      sha256:
        description: Exact reviewed lowercase VSIX SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install the checksum-locked workflow runner
        run: python3 workflows/shared/bootstrap.py --output "$RUNNER_TEMP/dockpipe"
      - name: Qualify the VSIX through Dockpipe
        id: editor
        run: |
          "$DOCKPIPE_BOOTSTRAP_BIN" --workflow-file workflows/editor.build/config.yml --workdir "$GITHUB_WORKSPACE" --
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dockpipe-language-support-candidate
          path: ${{ steps.editor.outputs.artifact_directory }}
          if-no-files-found: error
  marketplace:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dockpipe-language-support-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/editor-candidate
      - name: Install the checksum-locked workflow runner
        run: python3 workflows/shared/bootstrap.py --output "$RUNNER_TEMP/dockpipe"
      - name: Publish the reviewed bytes through Dockpipe
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          EDITOR_VERSION: ${{ inputs.version }}
          EDITOR_SHA256: ${{ inputs.sha256 }}
        run: |
          "$DOCKPIPE_BOOTSTRAP_BIN" --workflow-file workflows/editor.publish/config.yml --workdir "$GITHUB_WORKSPACE" -- --artifact-dir "$RUNNER_TEMP/editor-candidate" --version "$EDITOR_VERSION" --sha256 "$EDITOR_SHA256"
