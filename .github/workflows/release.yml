name: Release

# Merging to master ships a release: version comes from repo-root VERSION + release/releasenotes/X.Y.Z.md.
# Manual runs default to dry-run verification; production runs require master.
on:
  workflow_call:
    inputs:
      staging:
        description: Build a staging candidate after the caller's CI gates.
        required: true
        type: boolean
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.6.0). Leave empty to use VERSION file from the branch."
        required: false
        type: string
      dry_run:
        description: "Verify artifacts without deployment approval or publication (false requires master)"
        required: false
        default: true
        type: boolean
      build_msi:
        description: "Build Windows MSI (WiX). On push to master, use committed file release/packaging/msi/SHIP_MSI instead."
        required: false
        default: true
        type: boolean

concurrency:
  group: dockpipe-release-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'publish' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      dry_run: ${{ steps.m.outputs.dry_run }}
      build_msi: ${{ steps.m.outputs.build_msi }}
      candidate: ${{ steps.m.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6

      - id: m
        shell: bash
        env:
          INPUT_STAGING: ${{ inputs.staging }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BUILD_MSI: ${{ inputs.build_msi }}
        run: |
          set -euo pipefail
          dry_run="false"
          build_msi="false"
          candidate=""
          if [[ "${INPUT_STAGING:-false}" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/staging || "$GITHUB_REPOSITORY" != Dockpipe-Industries/dockpipe ]]; then
              echo "::error::Staging publication requires this repository's staging push."
              exit 1
            fi
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            raw="$(tr -d ' \n\r' < VERSION)"
            candidate="staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${GITHUB_SHA:0:12}"
            build_msi="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${INPUT_VERSION:-}"
            if [[ -z "${raw}" ]]; then
              raw="$(tr -d ' \n\r' < VERSION)"
            fi
            if [[ "${INPUT_DRY_RUN:-true}" == "true" ]]; then
              dry_run="true"
            fi
            case "${INPUT_BUILD_MSI:-true}" in
              true|True) build_msi="true" ;;
              *) build_msi="false" ;;
            esac
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            raw="$(tr -d ' \n\r' < VERSION)"
            if [[ -f release/packaging/msi/SHIP_MSI ]]; then
              build_msi="true"
            fi
          else
            echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi
          if [[ -z "$candidate" && "$dry_run" != "true" && "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::Production releases require master. Use dry_run=true for branch verification."
            exit 1
          fi
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver in VERSION / input: '${raw}'" >&2
            exit 1
          fi
          if [[ ! -f "release/releasenotes/${raw}.md" ]]; then
            echo "Missing release/releasenotes/${raw}.md" >&2
            exit 1
          fi
          tag="v${raw}"
          if [[ -n "$candidate" ]]; then
            candidate="${raw}-${candidate}"
            tag="v${candidate}"
          fi
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "build_msi=${build_msi}" >> "$GITHUB_OUTPUT"

      - name: Require an unpublished version
        if: steps.m.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.m.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/dockpipe-tag-check.err"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$error_file"; then
            echo "::error::This release tag already exists. Advance VERSION before publishing."
            exit 1
          elif ! grep -q 'HTTP 404' "$error_file"; then
            echo "::error::Could not verify whether the release tag exists."
            exit 1
          fi

  build-unix:
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev dpkg-dev
      - name: Install macOS Qt
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt mac desktop 6.8.3 clang_64 --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.3/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.8.3/macos" >> "$GITHUB_ENV"
      - name: Build native CLI, all package stores, and installers
        shell: bash
        run: bash release/packaging/build-platform.sh "${{ needs.meta.outputs.version }}"
      - name: Build native desktop installers
        shell: bash
        run: bash release/packaging/desktop/build-unix.sh "${{ needs.meta.outputs.version }}" release/artifacts
      - name: Native desktop installation smoke test
        shell: bash
        run: bash release/packaging/desktop/smoke-unix.sh "${{ needs.meta.outputs.version }}"
      - name: Native CLI and workflow smoke test
        shell: bash
        run: |
          python3 release/packaging/tests/native-smoke.py src/bin/dockpipe
          python3 packages/secrets/tests/environment-smoke.py src/bin/dockpipe "release/artifacts/stores/${{ matrix.platform }}"
      - name: Runtime and package regression tests
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          bash release/packaging/test-runtime.sh
          bash tests/run_tests.sh
      - name: Release tooling tests
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg python3-yaml
          /usr/bin/python3 -m unittest discover -s release/packaging/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/artifacts/
          if-no-files-found: error

  build-msi:
    needs: [meta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build Windows CLI and all package stores
        shell: bash
        run: bash release/packaging/build-platform.sh "${{ needs.meta.outputs.version }}"

      - name: Native CLI and workflow smoke test
        shell: bash
        run: python3 release/packaging/tests/native-smoke.py src/bin/dockpipe.exe

      - name: Run tests
        shell: bash
        run: |
          bash release/packaging/test-runtime.sh

      - name: Verify Windows installer failure recovery
        shell: powershell
        run: ./release/packaging/tests/windows-install.Tests.ps1

      - name: Verify MSI workflow parameter binding
        shell: pwsh
        run: ./release/packaging/tests/msi-workflow.Tests.ps1

      - name: Install Windows Qt
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows desktop runtime
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: ./release/packaging/desktop/build-windows.ps1 -Version "${{ needs.meta.outputs.version }}" -StageDir (Join-Path $PWD "bin/desktop-stage")

      # One pwsh step: GITHUB_ENV mangles/truncates Windows paths for WIX — pass -WixRoot into build.ps1 instead.
      - name: Install WiX and build MSI
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:TEMP "wix314.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP "wix314-expand"
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $destFull = (Resolve-Path -LiteralPath $dest).Path.TrimEnd('\')
          # wix314-binaries.zip puts candle.exe + light.exe at the extract root (not bin\). build.ps1 supports both layouts.
          $rootCandle = Join-Path $destFull "candle.exe"
          $binCandle = Join-Path $destFull "bin\candle.exe"
          if (-not ((Test-Path -LiteralPath $rootCandle) -or (Test-Path -LiteralPath $binCandle))) {
            throw "candle.exe not found at WiX zip root or under bin\ at $destFull"
          }
          $wixRoot = $destFull
          $v = "${{ needs.meta.outputs.version }}"
          $coreStageDir = Join-Path $PWD "bin\msi-core"
          New-Item -ItemType Directory -Force -Path $coreStageDir | Out-Null
          Copy-Item "release\artifacts\stores\windows-amd64\dockpipe-core-*.tar.gz" $coreStageDir
          $launcherStage = Join-Path $PWD "bin/desktop-stage"
          foreach ($required in @("dockpipe-launcher.exe", "Qt6Core.dll", "platforms/qwindows.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $launcherStage $required))) {
              throw "Desktop MSI requires the deployed launcher runtime: $required"
            }
          }
          New-Item -ItemType Directory -Force -Path bin\msi-dist | Out-Null
          $buildArgs = @{
            Version = $v
            SourceExe = Join-Path $PWD "src\bin\dockpipe.exe"
            CoreStageDir = $coreStageDir
            LauncherStageDir = $launcherStage
            OutDir = Join-Path $PWD "bin\msi-dist"
            WixRoot = $wixRoot
          }
          & (Join-Path $PWD "release\packaging\msi\build.ps1") @buildArgs

      - name: Smoke test MSI install/uninstall
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath (Join-Path $PWD "bin\msi-dist") -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "No MSI found under bin\\msi-dist"
          }
          $smokeArgs = @{ MsiPath = $msi.FullName; ExpectLauncher = $true }
          & (Join-Path $PWD "release\packaging\msi\smoke-test.ps1") @smokeArgs

      - name: Collect MSI
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: Copy-Item bin/msi-dist/*.msi release/artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: release/artifacts/
          if-no-files-found: error

  assemble:
    name: Assemble and verify artifacts
    needs: [meta, build-unix, build-msi]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.build-unix.result == 'success' && (needs.build-msi.result == 'success' || needs.build-msi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release/artifacts

      - name: Prepare release notes body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          NOTES_FILE="release/releasenotes/${VERSION}.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "Missing required release notes file: ${NOTES_FILE}" >&2
            exit 1
          fi
          cp "${NOTES_FILE}" release/artifacts/RELEASE_NOTES.md

      - name: Prepare installers and complete release catalog
        shell: bash
        run: |
          cp release/packaging/linux/install.sh release/artifacts/install.sh
          cp release/packaging/windows/install.ps1 release/artifacts/install.ps1
          python3 release/packaging/release-artifacts.py prepare release/artifacts --version "${{ needs.meta.outputs.version }}" --candidate "${{ needs.meta.outputs.candidate }}" --source-sha "${{ github.sha }}"

      - name: Install dry-run repository tools
        if: needs.meta.outputs.dry_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Build APT repository with a temporary test key
        if: needs.meta.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key 'DockPipe dry-run (not for publication)' rsa3072 sign 1d
          export APT_SIGNING_FINGERPRINT="$(gpg --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          bash release/packaging/build-apt.sh release/artifacts release/apt

      - name: Upload dry-run artifacts
        if: needs.meta.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dockpipe-release-dry-run-${{ needs.meta.outputs.version }}
          path: |
            release/artifacts/
            release/apt/
          if-no-files-found: error

      - name: Upload prepared production artifacts
        if: needs.meta.outputs.dry_run == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts/
          if-no-files-found: error

  publish:
    name: Publish production release
    needs: [meta, assemble]
    if: ${{ github.ref == 'refs/heads/master' && needs.meta.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Verify publication configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_SIGNING_KEY APT_SIGNING_FINGERPRINT R2_ENDPOINT_URL DOCKPIPE_RELEASE_BUCKET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release setting: $name"; exit 1; }
          done

      - name: Build signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          bash release/packaging/build-apt.sh release/artifacts release/apt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/artifacts/RELEASE_NOTES.md
          # MSI is optional (build-msi may be skipped); do not fail when artifacts dir has no .msi
          fail_on_unmatched_files: false
          files: |
            release/artifacts/*.tar.gz
            release/artifacts/*.zip
            release/artifacts/*.deb
            release/artifacts/*.msi
            release/artifacts/*.apk
            release/artifacts/*.rpm
            release/artifacts/*.pkg.tar.zst
            release/artifacts/*.sha256
            release/artifacts/release-manifest.json
            release/artifacts/install-manifest.json
            release/artifacts/install.sh
            release/artifacts/install.ps1
            release/artifacts/SHA256SUMS.txt

      - name: Publish all packages and signed APT repository to R2
        env:
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 release/packaging/publish-r2.py --artifacts release/artifacts --apt release/apt --version "${{ needs.meta.outputs.version }}"

  publish-staging:
    name: Publish staging candidate
    needs: [meta, assemble]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.meta.outputs.candidate != '' && needs.meta.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts

      - name: Require the current staging head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)"
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "::error::A newer staging commit exists; refusing stale publication."; exit 1; }

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Verify publication configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APT_SUITE: staging
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCKPIPE_RELEASE_BUCKET" == dockpipe-staging ]] || { echo "::error::Staging requires dockpipe-staging."; exit 1; }
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_SIGNING_KEY APT_SIGNING_FINGERPRINT R2_ENDPOINT_URL DOCKPIPE_RELEASE_BUCKET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release setting: $name"; exit 1; }
          done

      - name: Build signed APT repository
        env:
          APT_SUITE: staging
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          bash release/packaging/build-apt.sh release/artifacts release/apt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/artifacts/RELEASE_NOTES.md
          # MSI is optional (build-msi may be skipped); do not fail when artifacts dir has no .msi
          fail_on_unmatched_files: false
          files: |
            release/artifacts/*.tar.gz
            release/artifacts/*.zip
            release/artifacts/*.deb
            release/artifacts/*.msi
            release/artifacts/*.apk
            release/artifacts/*.rpm
            release/artifacts/*.pkg.tar.zst
            release/artifacts/*.sha256
            release/artifacts/release-manifest.json
            release/artifacts/install-manifest.json
            release/artifacts/install.sh
            release/artifacts/install.ps1
            release/artifacts/SHA256SUMS.txt

      - name: Publish all packages and signed APT repository to R2
        env:
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 release/packaging/publish-r2.py --artifacts release/artifacts --apt release/apt --version "${{ needs.meta.outputs.version }}" --candidate "${{ needs.meta.outputs.candidate }}"

  # Optional: dev.to — PUT main article (DEVTO_ARTICLE_ID) + optional one-time POST per release (DEVTO_ONE_TIME_POST).
  # See release/docs/devto.md
  devto:
    needs: [meta, publish]
    runs-on: ubuntu-latest
    environment: release
    if: ${{ github.ref == 'refs/heads/master' && needs.meta.outputs.dry_run == 'false' && vars.DEVTO_PUBLISH == 'true' && (vars.DEVTO_ARTICLE_ID != '' || vars.DEVTO_ONE_TIME_POST == 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Publish to dev.to (main PUT + optional one-time POST)
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ARTICLE_ID: ${{ vars.DEVTO_ARTICLE_ID }}
          DEVTO_ONE_TIME_POST: ${{ vars.DEVTO_ONE_TIME_POST }}
          DEVTO_TAGS: ${{ vars.DEVTO_TAGS }}
          DEVTO_TITLE: ${{ vars.DEVTO_TITLE }}
          DEVTO_ONE_TIME_TITLE: ${{ vars.DEVTO_ONE_TIME_TITLE }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVTO_API_KEY:-}" ]]; then
            echo "::error::Set secret DEVTO_API_KEY when DEVTO_PUBLISH is true."
            exit 1
          fi
          NOTES="release/releasenotes/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "::error::Missing ${NOTES}" >&2
            exit 1
          fi
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG}"
          TITLE_MAIN="${DEVTO_TITLE:-dockpipe ${TAG} released}"
          TITLE_ONETIME="${DEVTO_ONE_TIME_TITLE:-dockpipe ${TAG} released}"
          {
            printf '**[%s](%s)** — [GitHub release →](%s)\n\n' "${TAG}" "${RELEASE_URL}" "${RELEASE_URL}"
            echo "---"
            echo ""
            cat "${NOTES}"
          } > /tmp/devto-body.md
          TAGS_JSON=$(python3 <<'PY'
          import json, os
          raw = os.environ.get("DEVTO_TAGS") or "dockpipe,cli,golang"
          tags = [t.strip() for t in raw.split(",") if t.strip()]
          print(json.dumps(tags))
          PY
          )

          build_payload() {
            local title="$1"
            local out="$2"
            jq -n \
              --arg title "$title" \
              --rawfile body /tmp/devto-body.md \
              --arg canonical "$RELEASE_URL" \
              --argjson tags "$TAGS_JSON" \
              '{
                article: {
                  title: $title,
                  body_markdown: ($body | rtrimstr("\n")),
                  published: true,
                  canonical_url: $canonical,
                  tags: $tags
                }
              }' > "$out"
          }

          if [[ -n "${DEVTO_ARTICLE_ID:-}" ]]; then
            build_payload "$TITLE_MAIN" /tmp/devto-payload-main.json
            code=$(curl -sS -o /tmp/devto-resp.json -w "%{http_code}" \
              -X PUT "https://dev.to/api/articles/${DEVTO_ARTICLE_ID}" \
              -H "api-key: ${DEVTO_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary @/tmp/devto-payload-main.json)
            if [[ "$code" != "200" && "$code" != "201" ]]; then
              echo "::error::dev.to PUT (main) HTTP ${code}"
              cat /tmp/devto-resp.json >&2 || true
              exit 1
            fi
            echo "dev.to main article ${DEVTO_ARTICLE_ID} updated (HTTP ${code})."
          fi

          if [[ "${DEVTO_ONE_TIME_POST:-}" == "true" ]]; then
            build_payload "$TITLE_ONETIME" /tmp/devto-payload-onetime.json
            code=$(curl -sS -o /tmp/devto-resp-onetime.json -w "%{http_code}" \
              -X POST "https://dev.to/api/articles" \
              -H "api-key: ${DEVTO_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary @/tmp/devto-payload-onetime.json)
            if [[ "$code" != "200" && "$code" != "201" ]]; then
              echo "::error::dev.to POST (one-time) HTTP ${code}"
              cat /tmp/devto-resp-onetime.json >&2 || true
              exit 1
            fi
            ot_id=$(jq -r '.id // .article.id // empty' /tmp/devto-resp-onetime.json)
            ot_url=$(jq -r '.url // .article.url // empty' /tmp/devto-resp-onetime.json)
            echo "dev.to one-time post created (HTTP ${code}). id=${ot_id} url=${ot_url}"
          fi
