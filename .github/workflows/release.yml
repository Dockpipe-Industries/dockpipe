name: Release

# VERSION selects the release line/notes; the patch is generated from published tags.
# Manual runs default to dry-run verification; production runs require master.
on:
  workflow_call:
    inputs:
      staging:
        description: Build a staging candidate after the caller's CI gates.
        required: true
        type: boolean
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release baseline (e.g. 0.6.0); the patch is generated. Defaults to VERSION."
        required: false
        type: string
      dry_run:
        description: "Verify artifacts without deployment approval or publication (false requires master)"
        required: false
        default: true
        type: boolean
      build_msi:
        description: "Build Windows MSI (WiX). On push to master, use committed file workflows/package/windows-msi/assets/SHIP_MSI instead."
        required: false
        default: true
        type: boolean
      qualify_package_display:
        description: "Enable the bounded installed MainWindow package display qualifier (dry runs only)"
        required: false
        default: false
        type: boolean
      diagnose_layout:
        description: "Diagnose unchanged full macOS Intel CTest context (manual dry run with qualification only)"
        type: boolean
        default: false
      diagnose_windows_git:
        description: "Run only bounded Windows Git snapshot diagnostics (manual dry run only)"
        type: boolean
        default: false
      diagnostic_product_source:
        description: "Full unchanged product source commit required by layout diagnosis"
        type: string
        default: ''

concurrency:
  # Both publication channels share one allocator lock. Dry runs never reserve versions.
  group: dockpipe-release-${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_windows_git && format('windows-git-diagnostic-{0}', github.ref) || github.event_name == 'workflow_dispatch' && inputs.dry_run && format('dry-run-{0}{1}', github.ref, inputs.diagnose_layout && '-layout-diagnostic' || '') || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-git-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true && inputs.diagnose_windows_git == true && !inputs.diagnose_layout
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Diagnose only the Windows Git snapshot fixture
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: python3 workflows/shared/launch.py workflows/ci/runtime/windows-git-diagnostics.yml

  meta:
    if: (github.event_name == 'workflow_dispatch' || vars.DOCKPIPE_RELEASE_ENABLED == 'true') && !(github.event_name == 'workflow_dispatch' && inputs.diagnose_windows_git)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes_version: ${{ steps.m.outputs.notes_version }}
      dry_run: ${{ steps.m.outputs.dry_run }}
      build_msi: ${{ steps.m.outputs.build_msi }}
      qualify_package_display: ${{ steps.m.outputs.qualify_package_display }}
      candidate: ${{ steps.version.outputs.candidate }}
      diagnose_layout: ${{ steps.m.outputs.diagnose_layout }}
      diagnostic_product_source: ${{ steps.m.outputs.diagnostic_product_source }}
    steps:
      - uses: actions/checkout@v7

      - name: Public repository configuration boundary
        run: python3 workflows/shared/launch.py workflows/release/metadata/content.yml --

      - id: m
        shell: bash
        env:
          INPUT_STAGING: ${{ inputs.staging }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BUILD_MSI: ${{ inputs.build_msi }}
          INPUT_QUALIFY_PACKAGE_DISPLAY: ${{ inputs.qualify_package_display }}
          INPUT_DIAGNOSE_LAYOUT: ${{ inputs.diagnose_layout }}
          INPUT_DIAGNOSTIC_PRODUCT_SOURCE: ${{ inputs.diagnostic_product_source }}
          RELEASE_ENABLED: ${{ vars.DOCKPIPE_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          dry_run="false"
          build_msi="false"
          candidate=""
          if [[ "${INPUT_STAGING:-false}" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/staging || "${RELEASE_ENABLED:-}" != true ]]; then
              echo "::error::Staging publication requires an enabled repository's staging push."
              exit 1
            fi
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            raw="$(tr -d ' \n\r' < VERSION)"
            candidate="staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${GITHUB_SHA:0:12}"
            build_msi="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${INPUT_VERSION:-}"
            if [[ -z "${raw}" ]]; then
              raw="$(tr -d ' \n\r' < VERSION)"
            fi
            if [[ "${INPUT_DRY_RUN:-true}" == "true" ]]; then
              dry_run="true"
            fi
            case "${INPUT_BUILD_MSI:-true}" in
              true|True) build_msi="true" ;;
              *) build_msi="false" ;;
            esac
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            raw="$(tr -d ' \n\r' < VERSION)"
            if [[ -f workflows/package/windows-msi/assets/SHIP_MSI ]]; then
              build_msi="true"
            fi
          else
            echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi
          qualify_package_display="false"
          if [[ "${INPUT_QUALIFY_PACKAGE_DISPLAY:-false}" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$dry_run" != true ]]; then
              echo "::error::Package display qualification requires an explicit manual dry run."
              exit 1
            fi
            qualify_package_display="true"
          fi
          diagnose_layout="false"
          diagnostic_product_source=""
          if [[ "${INPUT_DIAGNOSE_LAYOUT:-false}" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$dry_run" != true || "$qualify_package_display" != true ]]; then
              echo '::error::Layout diagnosis requires a manual dry run with package display qualification.'
              exit 1
            fi
            diagnostic_product_source="${INPUT_DIAGNOSTIC_PRODUCT_SOURCE:-}"
            [[ "$diagnostic_product_source" =~ ^[0-9a-f]{40}$ ]] || {
              echo '::error::Layout diagnosis requires a full product source commit.'
              exit 1
            }
            diagnose_layout="true"
          fi
          if [[ -z "$candidate" && "$dry_run" != "true" && "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::Production releases require master. Use dry_run=true for branch verification."
            exit 1
          fi
          if [[ "$dry_run" != true && "${RELEASE_ENABLED:-}" != true ]]; then
            echo "::error::Configure release environments and set DOCKPIPE_RELEASE_ENABLED=true before publishing."
            exit 1
          fi
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver in VERSION / input: '${raw}'" >&2
            exit 1
          fi
          if [[ ! -f "release/releasenotes/${raw}.md" ]]; then
            echo "Missing release/releasenotes/${raw}.md" >&2
            exit 1
          fi
          echo "staging_suffix=${candidate}" >> "$GITHUB_OUTPUT"
          echo "notes_version=${raw}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "diagnose_layout=$diagnose_layout" >> "$GITHUB_OUTPUT"
          echo "diagnostic_product_source=$diagnostic_product_source" >> "$GITHUB_OUTPUT"
          echo "build_msi=${build_msi}" >> "$GITHUB_OUTPUT"
          echo "qualify_package_display=${qualify_package_display}" >> "$GITHUB_OUTPUT"

      - name: Generate the next native release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ steps.m.outputs.notes_version }}
          STAGING_SUFFIX: ${{ steps.m.outputs.staging_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$RUNNER_TEMP/dockpipe-release-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$tags"
          python3 workflows/shared/launch.py workflows/release/metadata/version.yml -- --base "$BASE_VERSION" \
            --tags "$tags" --staging-suffix "$STAGING_SUFFIX" --output "$GITHUB_OUTPUT"

      - name: Require an unpublished version
        if: steps.m.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/dockpipe-tag-check.err"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$error_file"; then
            echo "::error::This release tag already exists. Start a fresh complete release run."
            exit 1
          elif ! grep -q 'HTTP 404' "$error_file"; then
            echo "::error::Could not verify whether the release tag exists."
            exit 1
          fi

  build-unix:
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ needs.meta.outputs.diagnose_layout == 'true' && fromJSON('[{"runner":"macos-15-intel","platform":"darwin-amd64"}]') || fromJSON('[{"runner":"ubuntu-24.04","platform":"linux-amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},{"runner":"macos-15-intel","platform":"darwin-amd64"},{"runner":"macos-15","platform":"darwin-arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ needs.meta.outputs.diagnose_layout == 'true' && '0' || '1' }}
      - name: Bind unchanged diagnostic product source
        if: needs.meta.outputs.diagnose_layout == 'true'
        env:
          PRODUCT_SOURCE: ${{ needs.meta.outputs.diagnostic_product_source }}
        shell: bash
        run: python3 workflows/shared/launch.py workflows/build/desktop/layout-diagnostics.yml -- guard --product-source "$PRODUCT_SOURCE" --evidence "$RUNNER_TEMP/layout-diagnostic/preparation"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install macOS Qt
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt mac desktop 6.10.3 clang_64 --outputdir "$RUNNER_TEMP/Qt" --modules qtwebengine qtwebchannel qtpositioning
          echo "$RUNNER_TEMP/Qt/6.10.3/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.10.3/macos" >> "$GITHUB_ENV"
      - name: Prepare exact attested Browser SDK
        env:
          DOCKPIPE_ADAPTER_0: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 workflows/shared/launch.py workflows/dependencies/browser-sdk/prepare-release-unix.yml

      - name: Build native CLI and installers
        shell: bash
        run: python3 workflows/shared/launch.py workflows/build/platform/config.yml -- "${{ needs.meta.outputs.version }}"
      - name: Build Linux desktop against Ubuntu 22.04
        if: runner.os == 'Linux'
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          QUALIFY_PACKAGE_DISPLAY: ${{ needs.meta.outputs.qualify_package_display }}
        shell: bash
        run: python3 workflows/shared/launch.py workflows/build/desktop/release-linux.yml

      - name: Build native macOS desktop installers
        if: runner.os == 'macOS'
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          QUALIFY_PACKAGE_DISPLAY: ${{ needs.meta.outputs.qualify_package_display }}
          DIAGNOSE_LAYOUT: ${{ needs.meta.outputs.diagnose_layout }}
          PRODUCT_SOURCE: ${{ needs.meta.outputs.diagnostic_product_source }}
          DOCKPIPE_LAYOUT_DIAGNOSTICS: ${{ runner.temp }}/layout-diagnostic/desktop
        shell: bash
        run: python3 workflows/shared/launch.py workflows/build/desktop/release-macos.yml

      - name: Install and test Linux desktop on Ubuntu 22.04 and 24.04
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
        run: python3 workflows/shared/launch.py workflows/build/desktop/smoke-release-linux.yml

      - name: Native macOS desktop installation smoke test
        if: runner.os == 'macOS'
        shell: bash
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
        run: python3 workflows/shared/launch.py workflows/build/desktop/smoke-release-macos.yml

      - name: Native CLI and workflow smoke test
        shell: bash
        run: python3 workflows/shared/launch.py workflows/ci/runtime/smoke-release-unix.yml

      - name: Runtime and package regression tests
        if: matrix.platform == 'linux-amd64'
        run: python3 workflows/shared/launch.py workflows/ci/runtime/regressions-release.yml

      - name: Release tooling tests
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg python3-yaml
          python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/artifacts/
          if-no-files-found: error

      - name: Retain full-context layout diagnostic evidence
        if: ${{ always() && needs.meta.outputs.diagnose_layout == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layout-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/layout-diagnostic/
          if-no-files-found: error
          retention-days: 7

  build-msi:
    if: needs.meta.outputs.diagnose_layout != 'true'
    permissions:
      contents: read
      attestations: read
    needs: [meta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Windows CLI
        shell: bash
        run: python3 workflows/shared/launch.py workflows/build/platform/config.yml -- "${{ needs.meta.outputs.version }}"

      - name: Native CLI and workflow smoke test
        shell: bash
        run: python3 workflows/shared/launch.py workflows/ci/runtime/smoke-release-windows.yml

      - name: Run tests
        shell: bash
        run: python3 workflows/shared/launch.py workflows/ci/runtime/regressions-release-windows.yml

      - name: Verify Windows installer failure recovery
        shell: powershell
        run: python workflows/shared/launch.py workflows/install/windows/test-release.yml

      - name: Verify MSI workflow parameter binding
        shell: pwsh
        run: python workflows/shared/launch.py workflows/package/windows-msi/test-release.yml

      - name: Install Windows Qt
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtwebengine qtwebchannel qtpositioning
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed" }
          "$env:RUNNER_TEMP/Qt/6.10.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.10.3/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare exact attested Windows Browser SDK
        if: needs.meta.outputs.build_msi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: python workflows/shared/launch.py workflows/dependencies/browser-sdk/prepare-release-windows.yml

      - name: Build Windows desktop runtime
        if: needs.meta.outputs.build_msi == 'true'
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          QUALIFY_PACKAGE_DISPLAY: ${{ needs.meta.outputs.qualify_package_display }}
        shell: pwsh
        run: python workflows/shared/launch.py workflows/build/desktop/release-windows.yml

      - name: Install WiX and build MSI
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
        run: python workflows/shared/launch.py workflows/package/windows-msi/release.yml

      - name: Smoke test MSI install/uninstall
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: python workflows/shared/launch.py workflows/package/windows-msi/smoke-release.yml

      - name: Collect MSI
        if: needs.meta.outputs.build_msi == 'true'
        shell: pwsh
        run: Copy-Item bin/msi-dist/*.msi release/artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: release/artifacts/
          if-no-files-found: error

  build-flatpak:
    if: needs.meta.outputs.diagnose_layout != 'true'
    needs: [meta]
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    permissions:
      contents: read
      attestations: read

  assemble:
    name: Assemble and verify artifacts
    needs: [meta, build-unix, build-msi, build-flatpak]
    if: ${{ !cancelled() && needs.meta.outputs.diagnose_layout != 'true' && needs.meta.result == 'success' && needs.build-unix.result == 'success' && needs.build-flatpak.result == 'success' && (needs.build-msi.result == 'success' || needs.build-msi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release/artifacts

      - name: Prepare release notes body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.notes_version }}"
          NOTES_FILE="release/releasenotes/${VERSION}.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "Missing required release notes file: ${NOTES_FILE}" >&2
            exit 1
          fi
          python3 - "$NOTES_FILE" "${{ needs.meta.outputs.version }}" "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys
          notes, version, baseline = sys.argv[1:]
          body = Path(notes).read_text()
          body = re.sub(r"(?<![0-9.])" + re.escape(baseline) + r"(?![0-9.])", version, body)
          Path("release/artifacts/RELEASE_NOTES.md").write_text(body)
          PY

      - name: Prepare installers and complete release catalog
        shell: bash
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          DOCKPIPE_ADAPTER_1: ${{ needs.meta.outputs.candidate }}
          DOCKPIPE_ADAPTER_2: ${{ github.sha }}
        run: python3 workflows/shared/launch.py workflows/release/metadata/assemble.yml

      - name: Check public package contents
        run: python3 workflows/shared/launch.py workflows/release/metadata/content.yml -- --store-root release/artifacts/stores

      - name: Install dry-run repository tools
        if: needs.meta.outputs.dry_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Build APT repository with a temporary test key
        if: needs.meta.outputs.dry_run == 'true'
        shell: bash
        run: python3 workflows/shared/launch.py workflows/publish/apt/dry-run.yml

      - name: Upload dry-run artifacts
        if: needs.meta.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dockpipe-release-dry-run-${{ needs.meta.outputs.version }}
          path: |
            release/artifacts/
            release/apt/
          if-no-files-found: error

      - name: Upload prepared production artifacts
        if: needs.meta.outputs.dry_run == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts/
          if-no-files-found: error

  publish:
    name: Publish production release
    needs: [meta, assemble]
    if: ${{ github.ref == 'refs/heads/master' && needs.meta.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Verify publication configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_SIGNING_KEY APT_SIGNING_FINGERPRINT R2_ENDPOINT_URL DOCKPIPE_RELEASE_BUCKET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release setting: $name"; exit 1; }
          done

      - name: Build signed APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        shell: bash
        run: python3 workflows/shared/launch.py workflows/publish/apt/release.yml

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/artifacts/RELEASE_NOTES.md
          # MSI is optional (build-msi may be skipped); do not fail when artifacts dir has no .msi
          fail_on_unmatched_files: false
          files: |
            release/artifacts/*.tar.gz
            release/artifacts/*.zip
            release/artifacts/*.deb
            release/artifacts/*.msi
            release/artifacts/*.apk
            release/artifacts/*.rpm
            release/artifacts/*.pkg.tar.zst
            release/artifacts/*.sha256
            release/artifacts/release-manifest.json
            release/artifacts/install-manifest.json
            release/artifacts/install.sh
            release/artifacts/install.ps1
            release/artifacts/SHA256SUMS.txt

      - name: Publish all packages and signed APT repository to R2
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          DOCKPIPE_RELEASE_CHANNEL: stable
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 workflows/shared/launch.py workflows/publish/r2/release.yml

  publish-staging:
    name: Publish staging candidate
    needs: [meta, assemble]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.meta.outputs.candidate != '' && needs.meta.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts

      - name: Require the current staging head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)"
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "::error::A newer staging commit exists; refusing stale publication."; exit 1; }

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Verify publication configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APT_SUITE: staging
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_SIGNING_KEY APT_SIGNING_FINGERPRINT R2_ENDPOINT_URL DOCKPIPE_RELEASE_BUCKET; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release setting: $name"; exit 1; }
          done

      - name: Build signed APT repository
        env:
          APT_SUITE: staging
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        shell: bash
        run: python3 workflows/shared/launch.py workflows/publish/apt/staging.yml

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/artifacts/RELEASE_NOTES.md
          # MSI is optional (build-msi may be skipped); do not fail when artifacts dir has no .msi
          fail_on_unmatched_files: false
          files: |
            release/artifacts/*.tar.gz
            release/artifacts/*.zip
            release/artifacts/*.deb
            release/artifacts/*.msi
            release/artifacts/*.apk
            release/artifacts/*.rpm
            release/artifacts/*.pkg.tar.zst
            release/artifacts/*.sha256
            release/artifacts/release-manifest.json
            release/artifacts/install-manifest.json
            release/artifacts/install.sh
            release/artifacts/install.ps1
            release/artifacts/SHA256SUMS.txt

      - name: Publish all packages and signed APT repository to R2
        env:
          DOCKPIPE_ADAPTER_0: ${{ needs.meta.outputs.version }}
          DOCKPIPE_ADAPTER_1: ${{ needs.meta.outputs.candidate }}
          DOCKPIPE_RELEASE_BUCKET: ${{ vars.DOCKPIPE_RELEASE_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          DOCKPIPE_RELEASE_CHANNEL: staging
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 workflows/shared/launch.py workflows/publish/r2/staging.yml

  devto:
    needs: [meta, publish]
    runs-on: ubuntu-latest
    environment: release
    if: ${{ github.ref == 'refs/heads/master' && needs.meta.outputs.dry_run == 'false' && vars.DEVTO_PUBLISH == 'true' && (vars.DEVTO_ARTICLE_ID != '' || vars.DEVTO_ONE_TIME_POST == 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dockpipe-release-prepared-${{ needs.meta.outputs.version }}
          path: release/artifacts

      - name: Publish to dev.to (main PUT + optional one-time POST)
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ARTICLE_ID: ${{ vars.DEVTO_ARTICLE_ID }}
          DEVTO_ONE_TIME_POST: ${{ vars.DEVTO_ONE_TIME_POST }}
          DEVTO_TAGS: ${{ vars.DEVTO_TAGS }}
          NOTES_VERSION: ${{ needs.meta.outputs.notes_version }}
          TAG: ${{ needs.meta.outputs.tag }}
          ARTICLE_REPOSITORY: ${{ github.repository }}
          ARTICLE_SOURCE_SHA: ${{ github.sha }}
        run: python3 workflows/shared/launch.py workflows/publish/release-article/release.yml
