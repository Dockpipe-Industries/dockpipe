name: Native desktop qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, staging, master]
permissions:
  contents: read
  attestations: read

concurrency:
  group: native-macos-symbols-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-symbols:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Qualify native Git runtime
        shell: bash
        run: |
          set -euo pipefail
          go test ./src/lib/infrastructure -run '^TestWorkspaceGit' -count=1
          git_cli="$RUNNER_TEMP/dockpipe-git-runtime"
          if [ "$RUNNER_OS" = Windows ]; then git_cli="$git_cli.exe"; fi
          go build -trimpath -ldflags='-s -w' -o "$git_cli" ./src/cmd
          echo "DOCKPIPE_GIT_TEST_CLI=$git_cli" >> "$GITHUB_ENV"
      - name: Install matching release Qt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt mac desktop 6.10.3 clang_64 --outputdir "$RUNNER_TEMP/Qt" --modules qtwebengine qtwebchannel qtpositioning
          echo "$RUNNER_TEMP/Qt/6.10.3/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.10.3/macos" >> "$GITHUB_ENV"
      - name: Prepare exact attested Browser SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) browser_platform=darwin-arm64 ;;
            x86_64) browser_platform=darwin-amd64 ;;
            *) echo 'Unsupported macOS Browser SDK platform' >&2; exit 1 ;;
          esac
          python3 -B release/packaging/prepare-browser-sdk.py \
            --lock release/dependencies/spatialweb-browser.lock.json \
            --platform "$browser_platform" --output "$RUNNER_TEMP/browser-sdk"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/browser-sdk:$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
      - name: Qualify native Mach-O fixture
        shell: bash
        run: python3 -m unittest discover -s release/packaging/tests -p test_native_symbol_boundaries.py -v
      - name: Qualify DMG creation and bounded recovery
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s release/packaging/tests -p test_macos_dmg.py -v
          proof="$(mktemp -d "$RUNNER_TEMP/dockpipe-dmg-proof.XXXXXX")"
          mkdir "$proof/source"
          printf '%s\n' 'Disposable Dockpipe DMG qualification fixture' > "$proof/source/fixture.txt"
          bash release/packaging/desktop/macos/create-dmg.sh "$proof/source" "$proof/fixture.dmg"
          bash release/packaging/desktop/macos/verify-dmg.sh "$proof/fixture.dmg"
      - name: Build and audit the owned release binaries
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/dockpipe-native-symbols"
          # Match the release configuration and collect bounded layout timings.
          # Profiling is compiled out of normal product builds.
          cmake -S src/app/tooling/dockpipe-launcher -B "$build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS=-DDOCKPIPE_PROFILE_DASHBOARD_LAYOUT \
            "-DDOCKPIPE_RELEASE_VERSION=$(cat VERSION)" \
            "-DCMAKE_OSX_ARCHITECTURES=$(uname -m)" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build "$build" --parallel 2 --target \
            dockpipe-launcher dockpipe-launcher-ui qualification-workflow-launch-test \
            dashboard-workspace-test dashboard-browser-performance-test \
            terminal-shell-catalog-test terminal-session-test terminal-widget-test \
            workspace-package-manager-test project-files-graph-test project-files-markdown-test web-mermaid-renderer-test dashboard-files-test project-files-test dashboard-page-test launcher-status-bar-test git-commit-queue-test git-repository-conflict-test git-history-widget-test project-git-test browser-extensions-test browser-extension-package-test browser-extension-store-test browser-extension-crx-test browser-extension-compatibility-test browser-test canvas-widget-presentation-test
          macdeployqt "$build/DockPipe.app" -always-overwrite
          python3 release/packaging/desktop/macos/protect-owned-binaries.py \
            "$build/DockPipe.app" "$RUNNER_TEMP/dockpipe-native-symbol-audit.json"
      - name: Qualify live dashboard state and layout response
        env:
          QT_LOGGING_RULES: qt.webenginecontext.debug=true
          # These CTests use the offscreen platform, which has no native GL context.
          QT_QUICK_BACKEND: software
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        shell: bash
        run: |
          ctest --test-dir "$RUNNER_TEMP/dockpipe-native-symbols" --verbose \
            -R '^(qualification-workflow-launch|dashboard-(workspace|browser-performance|files|file-views)|terminal-(shell-catalog|session|widget)|workspace-package-manager|project-files(-graph|-markdown)?|web-mermaid-renderer|launcher-status-bar|browser|browser-canvas-mode|dashboard-canvas-widgets|canvas-widget-presentation|browser-extensions|browser-extension-(package|store|crx)|project-git|git-(commit-queue|repository-conflict|history-widget))$'

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Qualify the standard-user Windows test launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ tools are required.' }
          & (Join-Path $visualStudio 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VCToolsInstallDir) { throw 'The Visual Studio developer environment is incomplete.' }
          $launcher = Join-Path $env:RUNNER_TEMP 'windows-test-launcher.exe'
          $object = Join-Path $env:RUNNER_TEMP 'windows-test-launcher.obj'
          cl.exe /nologo /std:c++17 /EHsc /W4 /DUNICODE /D_UNICODE `
            src/app/tooling/dockpipe-launcher/tests/WindowsTestLauncher.cpp `
            "/Fe:$launcher" "/Fo:$object" /link advapi32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Windows test launcher compilation failed.' }
          & $launcher --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows test launcher qualification failed.' }
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Qualify native Git runtime
        shell: bash
        run: |
          set -euo pipefail
          go test ./src/lib/infrastructure -run '^TestWorkspaceGit' -count=1
          git_cli="$RUNNER_TEMP/dockpipe-git-runtime"
          if [ "$RUNNER_OS" = Windows ]; then git_cli="$git_cli.exe"; fi
          go build -trimpath -ldflags='-s -w' -o "$git_cli" ./src/cmd
          echo "DOCKPIPE_GIT_TEST_CLI=$git_cli" >> "$GITHUB_ENV"
      - name: Install matching release Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv "$env:RUNNER_TEMP/aqt-terminal"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the Qt installer environment.' }
          $python = "$env:RUNNER_TEMP/aqt-terminal/Scripts/python.exe"
          & $python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned Qt installer.' }
          & $python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtwebengine qtwebchannel qtpositioning
          if ($LASTEXITCODE -ne 0) { throw 'Could not install release Qt.' }
          "$env:RUNNER_TEMP/Qt/6.10.3/msvc2022_64/bin" >> $env:GITHUB_PATH
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.10.3/msvc2022_64" >> $env:GITHUB_ENV
      - name: Prepare exact attested Windows Browser SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B release/packaging/prepare-browser-sdk.py `
            --lock release/dependencies/spatialweb-browser.lock.json `
            --platform windows-amd64 --output "$env:RUNNER_TEMP/browser-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Browser SDK preparation failed.' }
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/browser-sdk;$env:CMAKE_PREFIX_PATH" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/browser-sdk/bin" >> $env:GITHUB_PATH
      - name: Build native terminal and installed-shell fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = "$env:RUNNER_TEMP/dockpipe-native-terminal"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ tools are required.' }
          $developerShell = Join-Path $visualStudio 'Common7/Tools/Launch-VsDevShell.ps1'
          & $developerShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VCToolsInstallDir) { throw 'The Visual Studio developer environment is incomplete.' }
          cmake -S src/app/tooling/dockpipe-launcher -B $build -G 'NMake Makefiles' -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Native terminal configuration failed.' }
          # Qualify the Core-only transport before compiling the full desktop.
          cmake --build $build --config Release --target terminal-session-win-test
          if ($LASTEXITCODE -ne 0) { throw 'Native terminal transport compilation failed.' }
          ctest --test-dir $build -C Release --verbose -R '^terminal-session-win$'
          $transportExit = $LASTEXITCODE
          $transportLog = Join-Path $build 'native-terminal-session-results.txt'
          if (Test-Path -LiteralPath $transportLog) { Get-Content -LiteralPath $transportLog }
          if ($transportExit -ne 0) { throw 'Native terminal transport qualification failed.' }
          # Isolate native embedding startup before compiling every desktop test.
          cmake --build $build --config Release --target desktop-app-window-win-test
          if ($LASTEXITCODE -ne 0) { throw 'Native embedding fixture compilation failed.' }
          # Match the installed application: standard-user fixtures use an exact
          # app-local Browser DLL instead of depending on the SDK directory ACLs.
          python -B release/packaging/desktop/browser-runtime.py `
            --sdk "$env:RUNNER_TEMP/browser-sdk" --platform windows-amd64 --runtime $build
          if ($LASTEXITCODE -ne 0) { throw 'Native test Browser runtime deployment failed.' }
          # Report effective static imports without replacing the native test gate.
          try {
              $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
              $cmake = (Get-Command cmake -ErrorAction Stop).Source
              $scanScript = (Resolve-Path src/app/tooling/dockpipe-launcher/tests/WindowsRuntimeDependencies.cmake).Path
              $scanArguments = @(
                  "`"-DTEST_EXECUTABLE=$build/desktop-app-window-win-test.exe`"",
                  "`"-DDUMPBIN=$dumpbin`"",
                  '-P', "`"$scanScript`""
              )
              $scan = Start-Process -FilePath $cmake -ArgumentList $scanArguments -NoNewWindow -PassThru
              try {
                  if (-not $scan.WaitForExit(60000)) {
                      $scan.Kill($true)
                      throw 'Windows import diagnostics exceeded the 60-second deadline.'
                  }
                  if ($scan.ExitCode -ne 0) { throw 'Windows import diagnostics failed.' }
              } finally {
                  $scan.Dispose()
              }
              Push-Location -LiteralPath $build
              try {
                  & (Join-Path $build 'windows-test-launcher.exe') --probe-runtime (Join-Path $build 'windows-runtime-dependencies.txt')
                  if ($LASTEXITCODE -ne 0) { Write-Warning 'Restricted runtime access diagnostics failed; native test follows.' }
              } finally {
                  Pop-Location
              }
          } catch {
              # Diagnostics must never replace the required native embedding gate.
              Write-Warning "Windows import diagnostics failed: $_"
          }
          $previousPluginDiagnostics = $env:QT_DEBUG_PLUGINS
          try {
            $env:QT_DEBUG_PLUGINS = '1'
            ctest --test-dir $build -C Release --verbose -R '^desktop-app-window-win$'
            if ($LASTEXITCODE -ne 0) {
              try {
                & ./src/app/tooling/dockpipe-launcher/tests/TraceWindowsFixtureLoader.ps1 -BuildDirectory $build
              } catch {
                Write-Warning "Loader diagnostics failed: $_"
              }
              throw 'Native embedding qualification failed.'
            }
          } finally {
            $env:QT_DEBUG_PLUGINS = $previousPluginDiagnostics
          }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native terminal compilation failed.' }
          # Exercise the same full desktop suite that gates the Windows release.
          ctest --test-dir $build -C Release --verbose --timeout 120 --stop-on-failure
          $qualificationExit = $LASTEXITCODE
          foreach ($testLog in Get-ChildItem -LiteralPath $build -Filter 'native-*-results.txt') {
            Write-Host "Qt test results: $($testLog.Name)"
            Get-Content -LiteralPath $testLog.FullName
          }
          if ($qualificationExit -ne 0) { throw 'Native terminal qualification failed.' }
      - name: Retain Windows loader diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-loader-trace
          path: ${{ runner.temp }}/dockpipe-native-terminal/windows-loader-trace
          if-no-files-found: ignore
          retention-days: 7

  host-version:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"

  flatpak-host:
    needs: host-version
    uses: ./.github/workflows/flatpak.yml
    permissions:
      contents: read
      attestations: read
    with:
      version: ${{ needs.host-version.outputs.version }}

  required-host:
    name: Native desktop host qualification
    permissions: {}
    if: ${{ always() }}
    needs: [owned-symbols, windows-terminal, flatpak-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every real host qualification result
        env:
          QUALIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ['QUALIFICATION_RESULTS'])
          expected = {'owned-symbols', 'windows-terminal', 'flatpak-host'}
          if set(results) != expected:
              sys.exit('Host qualification result set differs')
          failed = [name for name in expected if results[name]['result'] != 'success']
          if failed:
              sys.exit('Host qualification failed, skipped or cancelled: ' + ', '.join(sorted(failed)))
          PYTHON
