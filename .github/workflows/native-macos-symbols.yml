name: Native desktop qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, staging, master]
permissions:
  contents: read
  attestations: read

concurrency:
  group: native-macos-symbols-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-symbols:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Qualify the native macOS host through Dockpipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflows/shared/launch.py workflows/qualify/native-desktop/config.yml -- --platform macos --jobs 2

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Qualify the native Windows host through Dockpipe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python workflows/shared/launch.py workflows/qualify/native-desktop/config.yml -- --platform windows --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows qualification failed.' }
      - name: Retain Windows loader diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-loader-trace
          path: ${{ runner.temp }}/dockpipe-native-terminal/windows-loader-trace
          if-no-files-found: ignore
          retention-days: 7

  host-version:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"

  flatpak-host:
    needs: host-version
    uses: ./.github/workflows/flatpak.yml
    permissions:
      contents: read
      attestations: read
    with:
      version: ${{ needs.host-version.outputs.version }}

  required-host:
    name: Native desktop host qualification
    permissions: {}
    if: ${{ always() }}
    needs: [owned-symbols, windows-terminal, flatpak-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every real host qualification result
        env:
          QUALIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ['QUALIFICATION_RESULTS'])
          expected = {'owned-symbols', 'windows-terminal', 'flatpak-host'}
          if set(results) != expected:
              sys.exit('Host qualification result set differs')
          failed = [name for name in expected if results[name]['result'] != 'success']
          if failed:
              sys.exit('Host qualification failed, skipped or cancelled: ' + ', '.join(sorted(failed)))
          PYTHON
