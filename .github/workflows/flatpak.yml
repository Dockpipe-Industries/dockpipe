name: Flatpak qualification

# The desktop owns CLI/core/Qt/Browser and generic host extension contracts.
# Optional Marketplace packages qualify independently in flatpak-catalog.yml.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - release/dependencies/spatialweb-flatpak-browser.lock.json
      - release/packaging/prepare-flatpak-browser-sdk.py
      - release/packaging/tests/test_prepare_flatpak_browser_sdk.py
      - release/packaging/prepare-browser-sdk.py
      - release/packaging/desktop/browser-runtime.py
      - release/packaging/desktop/test_browser_runtime.py
      - release/packaging/tests/test_prepare_browser_sdk.py
      - release/packaging/desktop/flatpak/**
      - release/packaging/tests/fixtures/flatpak-package/**
      - release/packaging/tests/test_flatpak_workflow_boundaries.py
      - src/lib/infrastructure/packageplatform/**
      - src/lib/infrastructure/packagecatalog/**
      - src/lib/infrastructure/packagebuild/**
      - src/lib/application/package_remote.go
      - src/lib/application/bundled_tools.go
      - src/lib/application/dependencies.go
      - src/lib/application/internal/remotecmd/**
      - src/app/tooling/dockpipe-launcher/**
      - workflows/**

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DOCKPIPE_FLATPAK_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Install Flatpak SDK and runtime
        run: |
          set -euo pipefail
          export FLATPAK_USER_DIR="$RUNNER_TEMP/dockpipe-flatpak-installation"
          printf 'FLATPAK_USER_DIR=%s\n' "$FLATPAK_USER_DIR" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak python3-yaml xvfb xauth
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.kde.Sdk//6.10 org.kde.Platform//6.10 io.qt.qtwebengine.BaseApp//6.10
          python3 -B release/packaging/prepare-flatpak-browser-sdk.py \
            --lock release/dependencies/spatialweb-flatpak-browser.lock.json \
            --print-ref-pins > "$RUNNER_TEMP/flatpak-browser-ref-pins.tsv"
          while IFS=$'\t' read -r ref commit; do
            flatpak update --user --noninteractive --assumeyes --commit="$commit" "$ref"
          done < "$RUNNER_TEMP/flatpak-browser-ref-pins.tsv"
          # This is a software-rendering qualification input, not the SDK ABI.
          flatpak install --user --noninteractive --assumeyes --no-related flathub org.freedesktop.Platform.GL.default//25.08
          flatpak update --user --noninteractive --assumeyes \
            --commit=fe659a591fe882f573584ae62cfb55b92065e4ff7a972833271438bddfa6669e \
            runtime/org.freedesktop.Platform.GL.default/x86_64/25.08
      - name: Verify host and optional packaging boundaries
        run: python3 -B -m unittest discover -s release/packaging/tests -p test_flatpak_workflow_boundaries.py -v
      - name: Build CLI and required core store
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${DOCKPIPE_FLATPAK_VERSION:-}"
          if [[ -z "$version" ]]; then
            # Use the same numeric candidate identity as release dry runs.
            # VERSION is a release-line baseline, not the current engine version.
            tags="$RUNNER_TEMP/dockpipe-qualification-tags.txt"
            gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$tags"
            python3 release/packaging/release-version.py --base "$(cat VERSION)" --tags "$tags" > "$RUNNER_TEMP/dockpipe-qualification-version.txt"
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/dockpipe-qualification-version.txt")"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "$version" > VERSION
          export CGO_ENABLED=0
          export DOCKPIPE_PACKAGES_ROOT="$RUNNER_TEMP/core-compiled"
          export XDG_STATE_HOME="$RUNNER_TEMP/dockpipe-state"
          go build -trimpath -ldflags "-s -w -X main.Version=$version" -o "$RUNNER_TEMP/dockpipe" ./src/cmd
          "$RUNNER_TEMP/dockpipe" package compile core --workdir "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/dockpipe" package build store --workdir "$GITHUB_WORKSPACE" --only core --out "$RUNNER_TEMP/core-store"
      - name: Prepare exact attested Flatpak Browser SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B release/packaging/prepare-flatpak-browser-sdk.py --lock release/dependencies/spatialweb-flatpak-browser.lock.json \
            --verify-installed-refs --output "$RUNNER_TEMP/browser-sdk"
          echo "DOCKPIPE_FLATPAK_BROWSER_SDK=$RUNNER_TEMP/browser-sdk" >> "$GITHUB_ENV"
      - name: Build and test Flatpak desktop and generic bundled dependency
        shell: bash
        run: |
          set -euo pipefail
          bash release/packaging/desktop/flatpak/build.sh "$(cat VERSION)" "$RUNNER_TEMP/dockpipe" "$RUNNER_TEMP/core-store" "$RUNNER_TEMP/flatpak"
          bash release/packaging/desktop/flatpak/build-package.sh "$RUNNER_TEMP/flatpak/app" release/packaging/tests/fixtures/flatpak-package "$RUNNER_TEMP/flatpak-package"
      - name: Qualify installed Flatpak host terminals
        shell: bash
        run: |
          set -euo pipefail
          python3 release/packaging/desktop/flatpak/verify-installed-host.py \
            --bundle "$RUNNER_TEMP/flatpak/dockpipe-desktop_$(cat VERSION)_linux_amd64.flatpak" \
            --build-dir "$RUNNER_TEMP/flatpak/qt-build" \
            --out "$RUNNER_TEMP/flatpak-host-qualification"
      - name: Qualify real Docker and Compose bind mounts
        run: |
          docker pull debian:12
          python3 release/packaging/desktop/flatpak/container-smoke.py "$RUNNER_TEMP/flatpak/app"
      - name: Stage tested release artifacts
        if: inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          target=linux-amd64-flatpak-org.kde.Platform-6.10
          python3 release/packaging/release-artifacts.py verify-store "$RUNNER_TEMP/core-store" --core-only
          mkdir -p release/artifacts
          cp "$RUNNER_TEMP/flatpak/"*.flatpak release/artifacts/
          python3 - "$RUNNER_TEMP/core-store" "release/artifacts/stores/$target" "$target" <<'PYTHON'
          import json
          from pathlib import Path
          import shutil
          import sys

          source, destination = map(Path, sys.argv[1:3])
          manifest = json.loads((source / "packages-store-manifest.json").read_text())
          core = manifest["packages"]["core"]
          destination.mkdir(parents=True, exist_ok=False)
          shutil.copyfile(source / core["tarball"], destination / core["tarball"])
          (destination / (core["tarball"] + ".sha256")).write_text(core["sha256"] + "  " + core["tarball"] + "\n")
          # Core is platform neutral; this labels the tested desktop consumption target.
          manifest["platform"] = sys.argv[3]
          (destination / "packages-store-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
          python3 release/packaging/release-artifacts.py verify-store "release/artifacts/stores/$target" --core-only
      - uses: actions/upload-artifact@v7
        if: inputs.version != ''
        with:
          name: release-flatpak
          path: release/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.version == ''
        with:
          name: flatpak-host-qualification-amd64
          path: |
            ${{ runner.temp }}/flatpak/*.flatpak
            ${{ runner.temp }}/flatpak/*-commit.txt
            ${{ runner.temp }}/flatpak-package/store/
            ${{ runner.temp }}/core-store/
            ${{ runner.temp }}/flatpak-host-qualification/
          if-no-files-found: error
