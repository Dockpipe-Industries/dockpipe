name: Flatpak qualification

# Standalone runs produce qualification artifacts. The release caller includes
# the tested bundle and distinct Marketplace store in its normal publication gate.
on:
  workflow_call:
    inputs:
      staging:
        description: Use short retention only for the staging release caller.
        type: boolean
        default: false
      version:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - release/packaging/desktop/flatpak/**
      - release/packaging/tests/fixtures/flatpak-package/**
      - src/lib/infrastructure/packageplatform/**
      - src/lib/infrastructure/packagecatalog/**
      - src/lib/infrastructure/packagebuild/**
      - src/lib/application/package_remote.go
      - src/lib/application/bundled_tools.go
      - src/lib/application/dependencies.go
      - src/lib/application/internal/remotecmd/**
      - src/app/tooling/dockpipe-launcher/**
      - packages/**
      - workflows/**

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DOCKPIPE_FLATPAK_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Install Flatpak SDK and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.kde.Sdk//6.10 org.kde.Platform//6.10 io.qt.qtwebengine.BaseApp//6.10
      - name: Build CLI, core and pinned native store
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${DOCKPIPE_FLATPAK_VERSION:-}"
          if [[ -z "$version" ]]; then
            # Use the same numeric candidate identity as release dry runs.
            # VERSION is a release-line baseline, not the current engine version.
            tags="$RUNNER_TEMP/dockpipe-qualification-tags.txt"
            gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$tags"
            python3 release/packaging/release-version.py --base "$(cat VERSION)" --tags "$tags" > "$RUNNER_TEMP/dockpipe-qualification-version.txt"
            version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/dockpipe-qualification-version.txt")"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' "$version" > VERSION
          export CGO_ENABLED=0
          export DOCKPIPE_PACKAGES_ROOT="$RUNNER_TEMP/core-compiled"
          export XDG_STATE_HOME="$RUNNER_TEMP/dockpipe-state"
          go build -trimpath -ldflags "-s -w -X main.Version=$version" -o "$RUNNER_TEMP/dockpipe" ./src/cmd
          "$RUNNER_TEMP/dockpipe" package compile core --workdir "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/dockpipe" package build store --workdir "$GITHUB_WORKSPACE" --only core --out "$RUNNER_TEMP/core-store"
          wrapper_source="$GITHUB_WORKSPACE/workflows/ci/dockpipe-repo-quality"
          wrapper_work="$RUNNER_TEMP/main-owned"
          wrapper_target="$wrapper_work/workflows/dockpipe-repo-quality"
          mkdir -p "$wrapper_target/assets/flatpak" "$wrapper_target/assets/scripts"
          cp "$wrapper_source/config.yml" "$wrapper_source/package.yml" "$wrapper_target/"
          cp "$wrapper_source/assets/source-lock.json" "$wrapper_target/assets/"
          cp "$wrapper_source/assets/flatpak/package.json" "$wrapper_target/assets/flatpak/"
          cp "$wrapper_source/assets/scripts/repo-quality-pinned.py" "$wrapper_target/assets/scripts/"
          env -u DOCKPIPE_PACKAGES_ROOT "$RUNNER_TEMP/dockpipe" package compile workflows --workdir "$wrapper_work" --from "$wrapper_work/workflows" --force
          env -u DOCKPIPE_PACKAGES_ROOT "$RUNNER_TEMP/dockpipe" package build store --workdir "$wrapper_work" --only workflows --out "$RUNNER_TEMP/main-store" --version "$version"
          python3 release/packaging/ingest-pinned-stores.py \
            --lock release/packaging/pinned-stores.lock.json \
            --platform linux-amd64 --core-store "$RUNNER_TEMP/core-store" \
            --main-store "$RUNNER_TEMP/main-store" \
            --out "$RUNNER_TEMP/native-store"
      - name: Build and test Flatpak desktop and optional bundled dependency
        shell: bash
        run: |
          set -euo pipefail
          bash release/packaging/desktop/flatpak/build.sh "$(cat VERSION)" "$RUNNER_TEMP/dockpipe" "$RUNNER_TEMP/core-store" "$RUNNER_TEMP/flatpak"
          bash release/packaging/desktop/flatpak/build-package.sh "$RUNNER_TEMP/flatpak/app" release/packaging/tests/fixtures/flatpak-package "$RUNNER_TEMP/flatpak-package"
      - name: Qualify real Docker and Compose bind mounts
        run: |
          docker pull debian:12
          python3 release/packaging/desktop/flatpak/container-smoke.py "$RUNNER_TEMP/flatpak/app"
      - name: Build and qualify optional Flatpak catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s release/packaging/desktop/flatpak -p 'test_*.py'
          python3 release/packaging/desktop/flatpak/prepare-package-tools.py "$RUNNER_TEMP/package-tools" \
            --cache "$RUNNER_TEMP/package-downloads" --app "$RUNNER_TEMP/flatpak/app"
          python3 release/packaging/desktop/flatpak/build-catalog.py "$RUNNER_TEMP/flatpak/app" \
            "$RUNNER_TEMP/native-store" "$RUNNER_TEMP/package-tools" "$RUNNER_TEMP/flatpak-catalog"
      - name: Stage tested release artifacts
        if: inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          target=linux-amd64-flatpak-org.kde.Platform-6.10
          mkdir -p "release/artifacts/stores/$target"
          cp "$RUNNER_TEMP/flatpak/"*.flatpak release/artifacts/
          cp "$RUNNER_TEMP/flatpak-catalog/store/"* "release/artifacts/stores/$target/"
          cp "$RUNNER_TEMP/flatpak-catalog/qualification.json" "release/artifacts/stores/$target/"
      - uses: actions/upload-artifact@v7
        if: inputs.version != ''
        with:
          name: release-flatpak
          retention-days: ${{ inputs.staging && github.event_name == 'push' && github.ref == 'refs/heads/staging' && 3 || 0 }}
          path: release/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.version == ''
        with:
          name: flatpak-qualification-amd64
          path: |
            ${{ runner.temp }}/flatpak/*.flatpak
            ${{ runner.temp }}/flatpak/*-commit.txt
            ${{ runner.temp }}/flatpak-package/store/
            ${{ runner.temp }}/flatpak-catalog/store/
            ${{ runner.temp }}/flatpak-catalog/qualification.json
          if-no-files-found: error
