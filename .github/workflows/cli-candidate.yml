name: CLI bootstrap candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - VERSION
      - go.mod
      - go.sum
      - embed*.go
      - src/cmd/**
      - src/lib/**
      - src/core/**
      - release/packaging/build-cli-candidate.py
      - release/packaging/release-version.py
      - release/packaging/embedded-inputs.py
      - release/packaging/publish-cli-candidate.py
      - release/packaging/publish-launcher-sdk.py
      - release/packaging/tests/test_cli_candidate.py
      - .github/workflows/cli-candidate.yml
  push:
    branches: [dev]
    paths:
      - VERSION
      - go.mod
      - go.sum
      - embed*.go
      - src/cmd/**
      - src/lib/**
      - src/core/**
      - release/packaging/build-cli-candidate.py
      - release/packaging/release-version.py
      - release/packaging/embedded-inputs.py
      - release/packaging/publish-cli-candidate.py
      - release/packaging/publish-launcher-sdk.py
      - release/packaging/tests/test_cli_candidate.py
      - .github/workflows/cli-candidate.yml

permissions:
  contents: read

concurrency:
  group: cli-candidate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify candidate boundaries
        run: python3 -B -m unittest discover -s release/packaging/tests -p test_cli_candidate.py -v
      - name: Build pure-Go CLI archives from fresh public module pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B release/packaging/build-cli-candidate.py \
            --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --work-directory "$RUNNER_TEMP/cli-candidate-work" \
            --output "$RUNNER_TEMP/cli-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-bootstrap-candidate
          path: ${{ runner.temp }}/cli-candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-bootstrap-candidate
          path: ${{ runner.temp }}/cli-candidate
      - name: Attest the exact CLI candidate assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ runner.temp }}/cli-candidate/*.tar.gz
            ${{ runner.temp }}/cli-candidate/*.zip
            ${{ runner.temp }}/cli-candidate/cli-candidate.json
      - name: Publish the immutable CLI-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/packaging/publish-cli-candidate.py --directory "$RUNNER_TEMP/cli-candidate"
