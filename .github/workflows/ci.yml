# Tests, packaging, and release-safety checks in one workflow.
# See release/docs/branching.md
# Local: quick tests  make test-quick  |  GitHub Actions emulation  make ci
# Full local CI uses nektos/act + Docker to run this workflow's test job.
#
# --- Optional GitHub repo configuration (Settings → Secrets and variables → Actions) ---
#
# Optional Codex workflows in this job:
#   Variable  DOCKPIPE_CI_CODEX     Set to "true" to run workflows/codex-pav and workflows/codex-security in CI (pulls Codex image; needs network).
#   Secret    OPENAI_API_KEY        OpenAI API key for Codex when DOCKPIPE_CI_CODEX is true (same as local Codex usage).
#
# dev.to release posts (release.yml only — not this job):
#   Variables DEVTO_PUBLISH, DEVTO_ARTICLE_ID, optional DEVTO_TAGS, DEVTO_TITLE
#   Secret    DEVTO_API_KEY
#   See release/docs/devto.md
#
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, staging, dev]
  push:
    branches: [master, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - name: Public repository configuration boundary
        run: python3 release/packaging/check-public-content.py

      - name: Install build and shell-test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            python3-yaml \
            apt-utils \
            gnupg \
            ripgrep \
            shellcheck \
            qt6-base-dev \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            libqt6webenginecore6-bin \
            libqt6opengl6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Release tooling contracts before builds
        run: /usr/bin/python3 -B -m unittest discover -s release/packaging/tests -v

      # Flatpak qualification owns the native desktop build and tests.
      - name: Build CLI (Bash tests use src/bin/dockpipe)
        run: make build-core

      - name: govulncheck + gosec
        env:
          DOCKPIPE_WORKDIR: ${{ github.workspace }}
          DOCKPIPE_WORKFLOW_NAME: ci
        run: |
          set -euo pipefail
          CI_RAW_DIR="$(./src/bin/dockpipe scope artifacts ci-raw --workdir "$DOCKPIPE_WORKDIR")"
          export DOCKPIPE_CI_RAW_DIR="$CI_RAW_DIR"
          rm -rf "$CI_RAW_DIR"
          mkdir -p "$CI_RAW_DIR"
          GOBIN="$(go env GOPATH)/bin"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          set +e
          "$GOBIN/govulncheck" -format json ./... > "$CI_RAW_DIR/govulncheck.json"
          VC=$?
          if [[ $VC -eq 0 ]]; then
            # JSON output reports findings without a failing exit status. Convert
            # the same scan to text to enforce reachable vulnerabilities as a gate.
            "$GOBIN/govulncheck" -mode convert < "$CI_RAW_DIR/govulncheck.json"
            VC=$?
          fi
          "$GOBIN/gosec" -conf .gosec.json -fmt json -out="$CI_RAW_DIR/gosec.json" -exclude-dir=.gomodcache -exclude-dir=bin/.dockpipe -exclude-dir=testdata ./...
          GC=$?
          set -e
          echo "::group::gosec stats (JSON)"
          jq '.Stats // empty' "$CI_RAW_DIR/gosec.json" || true
          echo "::endgroup::"
          if [[ $VC -ne 0 ]]; then
            echo "::error::govulncheck failed (exit $VC)"
            exit "$VC"
          fi
          if [[ $GC -ne 0 ]]; then
            echo "::error::gosec failed (exit $GC)"
            exit "$GC"
          fi

      - name: Runtime Go tests
        run: bash release/packaging/test-runtime.sh

      - name: Pinned repository workflow tests
        run: python3 -B -m unittest discover -s workflows/ci/dockpipe-repo-quality/tests -p 'test_*.py'

      - name: Staticcheck
        run: staticcheck ./...

      - name: ShellCheck syntax gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_scripts < <(git ls-files '*.sh' ':!:src/app/tooling/vscode-extensions/**/node_modules/**' ':!:bin/**')
          existing_shell_scripts=()
          for script in "${shell_scripts[@]}"; do
            [[ -f "$script" ]] && existing_shell_scripts+=("$script")
          done
          if ((${#existing_shell_scripts[@]})); then
            shellcheck -S error "${existing_shell_scripts[@]}"
          fi

      - name: Templates/core path guard (docs + code)
        run: bash src/scripts/check-templates-core-paths.sh

      # Workflow "test" = go test + vet + staticcheck + govulncheck + gosec inside Docker (tools installed in-container; only mod cache mounted).
      - name: Dockpipe workflow — test
        if: ${{ env.ACT != 'true' }}
        env:
          DOCKPIPE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ./src/bin/dockpipe --workflow test --runtime docker --workdir "${{ github.workspace }}" \
            --mount "$(go env GOPATH)/pkg:/go/pkg:rw" \
            --

      # Optional: Codex resolver workflows (set repo variable DOCKPIPE_CI_CODEX=true and secret OPENAI_API_KEY).
      - name: Dockpipe workflows — codex-pav, codex-security (optional)
        if: ${{ vars.DOCKPIPE_CI_CODEX == 'true' }}
        env:
          DOCKPIPE_REPO_ROOT: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Set repository secret OPENAI_API_KEY when vars.DOCKPIPE_CI_CODEX is true."
            exit 1
          fi
          ./src/bin/dockpipe --workflow codex-pav --resolver codex --runtime docker --workdir "${{ github.workspace }}" --
          ./src/bin/dockpipe --workflow codex-security --resolver codex --runtime docker --workdir "${{ github.workspace }}" --

      # Ship PRs update release-line notes; the publication workflow generates patch numbers.
      - name: Release notes (PRs targeting master only)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master'
        shell: bash
        run: |
          set -euo pipefail
          V=$(tr -d ' \n\r' < VERSION)
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a single line semver X.Y.Z (got '$V')"
            exit 1
          fi
          notes="release/releasenotes/${V}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing $notes for VERSION=$V — add or bump VERSION and matching release/releasenotes/X.Y.Z.md"
            exit 1
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          if ! grep -Fxq -- "$notes" <<< "$changed"; then
            echo "::error::This PR must modify $notes (current VERSION is $V)."
            echo "Changed paths:"
            echo "$changed"
            exit 1
          fi
          echo "OK: shipping $V release line with updated $notes; patch number is generated."

      - name: Build amd64 .deb (for test_deb_install.sh)
        run: bash ./release/packaging/build-deb.sh "$(tr -d ' \t\r\n' < VERSION)" amd64

      - name: Shell unit tests
        run: bash tests/run_tests.sh

      - name: Integration tests (Docker)
        if: ${{ env.ACT != 'true' }}
        run: bash tests/integration-tests/run.sh

      - name: Upload CI scan receipts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dockpipe-ci-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bin/.dockpipe/workflows/ci/artifacts/ci-raw/

  # Windows: Go + bash scripts that mirror host pre-script behavior (Git Bash on the runner).
  # Full tests/run_tests.sh and Docker integration tests stay on Linux — Docker/Linux images
  # are not reliable on windows-latest the same way as ubuntu-latest.
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - name: Pinned package-store composition on Windows
        run: python3 -B -m unittest discover -s release/packaging/tests -p 'test_package_store_composition.py'

      - name: Runtime Go tests
        run: bash release/packaging/test-runtime.sh

      - name: Templates/core path guard (docs + code)
        run: bash src/scripts/check-templates-core-paths.sh

      - name: clone-worktree include script (bash + git)
        run: bash tests/unit-tests/test_clone_worktree_include.sh

  cockpit-native:
    name: Cockpit native SDK and rendering
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Install matching native SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv xvfb xauth \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libx11-dev \
            libxcomposite-dev libxrender-dev libxres-dev libxext-dev libxcb1-dev \
            libnss3 libasound2 libsdl2-2.0-0 libopus0 libminizip1
      - name: Install pinned Qt ABI
        run: |
          bash release/packaging/desktop/install-linux-qt.sh "$RUNNER_TEMP/Qt"
          echo "DOCKPIPE_QT_ROOT=$RUNNER_TEMP/Qt/6.10.3/gcc_64" >> "$GITHUB_ENV"
      - name: Build the repository CLI
        run: make build-core
      - name: Prepare exact attested Browser SDK
        run: |
          python3 release/packaging/prepare-browser-sdk.py --lock release/dependencies/spatialweb-browser.lock.json \
            --platform linux-amd64 --output "$RUNNER_TEMP/browser-sdk"
      - name: Verify public publisher and qualify installed Cockpit
        run: |
          python3 release/packaging/prepare-cockpit.py prepare \
            --lock release/cockpit.lock.json --output "$RUNNER_TEMP/cockpit-runtime"
          cmake -S src/app/tooling/dockpipe-launcher -B "$RUNNER_TEMP/cockpit-host" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$DOCKPIPE_QT_ROOT;$RUNNER_TEMP/browser-sdk" \
            -DDOCKPIPE_COCKPIT_ASSETS="$RUNNER_TEMP/cockpit-runtime/package/resolvers/cockpit/assets"
          python3 release/packaging/prepare-cockpit.py verify-compiler \
            --lock release/cockpit.lock.json --store "$RUNNER_TEMP/cockpit-runtime/store" \
            --build "$RUNNER_TEMP/cockpit-host"
          cmake --build "$RUNNER_TEMP/cockpit-host" --target cockpit-package-rendering-test --parallel 2
          LD_LIBRARY_PATH="$DOCKPIPE_QT_ROOT/lib:$RUNNER_TEMP/browser-sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir "$RUNNER_TEMP/cockpit-host" --output-on-failure -R '^cockpit-package-rendering$' --no-tests=error

  staging-release:
    needs: [test, test-windows, cockpit-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.DOCKPIPE_RELEASE_ENABLED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # GitHub requires inheritance to resolve the called job's environment secrets.
    # https://github.com/actions/runner/issues/4453
    secrets: inherit
    with:
      staging: true
