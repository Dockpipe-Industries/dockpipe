name: Compiler bootstrap
on:
  push:
    branches: [dev]
    paths:
      - src/lib/application/internal/packagecompile/**
      - src/lib/infrastructure/packagebuild/**
      - .github/workflows/compiler-bootstrap.yml
      - workflows/build/compiler-bootstrap/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested compiler-only prerelease
        type: boolean
        default: false

concurrency:
  group: dockpipe-release-publish
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
      - name: Generic compiler and catalog regressions
        run: python3 workflows/shared/launch.py workflows/build/compiler-bootstrap/test-contracts.yml

      - name: Read shared version allocation history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/compiler-tags.txt"
      - name: Build and verify compiler-only archive
        run: |
          python3 workflows/shared/launch.py workflows/build/compiler-bootstrap/config.yml -- \
            --tags "$RUNNER_TEMP/compiler-tags.txt" --out "$RUNNER_TEMP/compiler-bootstrap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-bootstrap-linux-amd64
          path: ${{ runner.temp }}/compiler-bootstrap/
          if-no-files-found: error
      - name: Publish compiler-only GitHub prerelease
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflows/shared/launch.py workflows/publish/compiler-bootstrap/config.yml -- "$RUNNER_TEMP/compiler-bootstrap"
