name: Compiler bootstrap
on:
  push:
    branches: [dev]
    paths:
      - src/lib/application/internal/packagecompile/**
      - src/lib/infrastructure/packagebuild/**
      - .github/workflows/compiler-bootstrap.yml
      - release/packaging/compiler-bootstrap/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested compiler-only prerelease
        type: boolean
        default: false

concurrency:
  group: dockpipe-release-publish
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
      - name: Generic compiler and catalog regressions
        run: |
          go test ./src/lib/application/internal/packagecompile ./src/lib/infrastructure/packagebuild ./src/lib/infrastructure/packagecatalog
          go test ./src/lib/application -run TestResolverAssetsScope -count=1
          python3 -B -m unittest discover -s release/packaging/compiler-bootstrap -p 'test_*.py' -v
      - name: Read shared version allocation history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/compiler-tags.txt"
      - name: Build and verify compiler-only archive
        run: |
          python3 -B release/packaging/compiler-bootstrap/build.py \
            --tags "$RUNNER_TEMP/compiler-tags.txt" --out "$RUNNER_TEMP/compiler-bootstrap"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-bootstrap-linux-amd64
          path: ${{ runner.temp }}/compiler-bootstrap/
          if-no-files-found: error
      - name: Publish compiler-only GitHub prerelease
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/packaging/compiler-bootstrap/publish.sh "$RUNNER_TEMP/compiler-bootstrap"
