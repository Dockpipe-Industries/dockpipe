name: Display SDK candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - LICENSE
      - workflows/shared/**
      - workflows/publish/shared/**
      - src/app/tooling/dockpipe-launcher/display-sdk/**
      - src/app/tooling/dockpipe-launcher/src/LauncherDisplayPackage.h
      - src/app/tooling/dockpipe-launcher/src/LauncherNativeLibraryScope.h
      - workflows/build/display-sdk/assets/scripts/build.py
      - workflows/build/launcher-sdk/assets/scripts/build.py
      - workflows/publish/display-sdk/assets/scripts/publish.py
      - workflows/publish/launcher-sdk/assets/scripts/publish.py
      - workflows/build/display-sdk/tests/test_display_sdk_producer.py
      - workflows/publish/display-sdk/tests/test_publish_display_sdk.py
      - .github/workflows/display-sdk-candidate.yml
  push:
    branches: [dev]
    paths:
      - LICENSE
      - workflows/shared/**
      - workflows/publish/shared/**
      - src/app/tooling/dockpipe-launcher/display-sdk/**
      - src/app/tooling/dockpipe-launcher/src/LauncherDisplayPackage.h
      - src/app/tooling/dockpipe-launcher/src/LauncherNativeLibraryScope.h
      - workflows/build/display-sdk/assets/scripts/build.py
      - workflows/build/launcher-sdk/assets/scripts/build.py
      - workflows/publish/display-sdk/assets/scripts/publish.py
      - workflows/publish/launcher-sdk/assets/scripts/publish.py
      - workflows/build/display-sdk/tests/test_display_sdk_producer.py
      - workflows/publish/display-sdk/tests/test_publish_display_sdk.py
      - .github/workflows/display-sdk-candidate.yml

permissions:
  contents: read

concurrency:
  group: display-sdk-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-amd64
            aqt_host: linux
            aqt_arch: linux_gcc_64
            qt_directory: gcc_64
          - runner: windows-latest
            platform: windows-amd64
            aqt_host: windows
            aqt_arch: win64_msvc2022_64
            qt_directory: msvc2022_64
          - runner: macos-15-intel
            platform: darwin-amd64
            aqt_host: mac
            aqt_arch: clang_64
            qt_directory: macos
          - runner: macos-15
            platform: darwin-arm64
            aqt_host: mac
            aqt_arch: clang_64
            qt_directory: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            python3-venv libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb1-dev libdbus-1-3
      - name: Install the exact Qt Widgets kit
        shell: python
        env:
          AQT_HOST: ${{ matrix.aqt_host }}
          AQT_ARCH: ${{ matrix.aqt_arch }}
          QT_DIRECTORY: ${{ matrix.qt_directory }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          environment = root / 'display-sdk-aqt'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True, timeout=120)
          python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', 'aqtinstall==3.3.0'], check=True, timeout=300)
          subprocess.run([str(python), '-m', 'aqt', 'install-qt', os.environ['AQT_HOST'],
                          'desktop', '6.10.3', os.environ['AQT_ARCH'], '--outputdir', str(root / 'Qt')],
                         check=True, timeout=1200)
          qt = root / 'Qt/6.10.3' / os.environ['QT_DIRECTORY']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('DISPLAY_SDK_QT_ROOT=' + str(qt) + '\n')
      - name: Test producer and immutable publication boundaries
        shell: python
        run: |
          import subprocess
          import sys
          for directory in ('workflows/build/display-sdk/tests', 'workflows/publish/display-sdk/tests'):
              subprocess.run([sys.executable, 'workflows/shared/launch.py',
                              'workflows/ci/workflow-contracts/config.yml', '--', '--suite', directory],
                             check=True, timeout=120)
      - name: Qualify the relocated native interface SDK
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          subprocess.run([sys.executable, 'workflows/shared/launch.py', 'workflows/build/display-sdk/config.yml', '--',
                          '--source-root', os.environ['GITHUB_WORKSPACE'], '--source-sha', os.environ['GITHUB_SHA'],
                          '--qt-root', os.environ['DISPLAY_SDK_QT_ROOT'],
                          '--work-directory', str(root / 'display-sdk-work'),
                          '--output', str(root / 'display-sdk'), '--jobs', '2'], check=True, timeout=1200)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: display-sdk-${{ matrix.platform }}
          path: ${{ runner.temp }}/display-sdk/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, windows-amd64, darwin-amd64, darwin-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: display-sdk-${{ matrix.platform }}
          path: ${{ runner.temp }}/display-sdk
      - name: Attest the qualified native SDK
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ runner.temp }}/display-sdk/*.tar.gz
            ${{ runner.temp }}/display-sdk/sdk-files.json
            ${{ runner.temp }}/display-sdk/sdk-release.json
      - name: Publish one immutable platform candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_SDK_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 workflows/shared/launch.py workflows/publish/display-sdk/config.yml -- \
            --directory "$RUNNER_TEMP/display-sdk" --platform "$DISPLAY_SDK_PLATFORM"
