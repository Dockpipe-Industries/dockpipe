name: Launcher SDK candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - src/app/tooling/dockpipe-launcher/**
      - packages/native-sdk/**
      - release/packaging/build-launcher-sdk.py
      - release/packaging/publish-launcher-sdk.py
      - release/packaging/tests/test_launcher_sdk_producer.py
      - release/packaging/tests/test_publish_launcher_sdk.py
      - .github/workflows/launcher-sdk-candidate.yml
  push:
    branches: [dev]
    paths:
      - src/app/tooling/dockpipe-launcher/**
      - packages/native-sdk/**
      - release/packaging/build-launcher-sdk.py
      - release/packaging/publish-launcher-sdk.py
      - .github/workflows/launcher-sdk-candidate.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv libgl1-mesa-dev \
            libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxcomposite-dev libxrender-dev libxres-dev libxext-dev \
            libxcb1-dev libnss3 libasound2
      - name: Install matching Qt SDK
        run: bash release/packaging/desktop/install-linux-qt.sh "$RUNNER_TEMP/Qt"
      - name: Qualify SDK archive producer
        run: |
          python3 -B -m unittest discover -s release/packaging/tests -p test_launcher_sdk_producer.py -v
          python3 -B -m unittest discover -s release/packaging/tests -p test_publish_launcher_sdk.py -v
      - name: Build and qualify relocated SDK
        run: |
          python3 -B release/packaging/build-launcher-sdk.py \
            --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --qt-root "$RUNNER_TEMP/Qt/6.10.3/gcc_64" \
            --work-directory "$RUNNER_TEMP/launcher-sdk-build" \
            --output "$RUNNER_TEMP/launcher-sdk" --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-sdk-linux-amd64
          path: ${{ runner.temp }}/launcher-sdk/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-sdk-linux-amd64
          path: ${{ runner.temp }}/launcher-sdk
      - name: Attest qualified SDK
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ runner.temp }}/launcher-sdk/*.tar.gz
            ${{ runner.temp }}/launcher-sdk/sdk-files.json
            ${{ runner.temp }}/launcher-sdk/sdk-release.json
      - name: Publish immutable SDK candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/packaging/publish-launcher-sdk.py --directory "$RUNNER_TEMP/launcher-sdk"
