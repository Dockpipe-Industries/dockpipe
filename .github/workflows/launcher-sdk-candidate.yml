name: Launcher SDK candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - LICENSE
      - workflows/shared/**
      - workflows/publish/shared/**
      - src/dockpipe-app/**
      - workflows/shared/lib/elf_artifacts.py
      - workflows/build/desktop/assets/licenses/**
      - workflows/build/desktop/assets/scripts/install-linux-qt.sh
      - workflows/dependencies/browser-sdk/assets/spatialweb-browser.lock.json
      - workflows/dependencies/browser-sdk/assets/scripts/browser-runtime.py
      - workflows/dependencies/browser-sdk/tests/test_browser_runtime.py
      - workflows/dependencies/browser-sdk/assets/scripts/prepare-browser-sdk.py
      - workflows/build/flatpak/assets/scripts/prepare-flatpak-browser-sdk.py
      - workflows/build/flatpak/tests/test_prepare_flatpak_browser_sdk.py
      - workflows/dependencies/browser-sdk/tests/test_prepare_browser_sdk.py
      - workflows/build/launcher-sdk/assets/scripts/build.py
      - workflows/publish/launcher-sdk/assets/scripts/publish.py
      - workflows/build/launcher-sdk/tests/test_launcher_sdk_producer.py
      - workflows/publish/launcher-sdk/tests/test_publish_launcher_sdk.py
      - .github/workflows/launcher-sdk-candidate.yml
  push:
    branches: [dev]
    paths:
      - LICENSE
      - workflows/shared/**
      - workflows/publish/shared/**
      - src/dockpipe-app/**
      - workflows/shared/lib/elf_artifacts.py
      - workflows/build/desktop/assets/licenses/**
      - workflows/build/desktop/assets/scripts/install-linux-qt.sh
      - workflows/dependencies/browser-sdk/assets/spatialweb-browser.lock.json
      - workflows/dependencies/browser-sdk/assets/scripts/browser-runtime.py
      - workflows/dependencies/browser-sdk/tests/test_browser_runtime.py
      - workflows/dependencies/browser-sdk/assets/scripts/prepare-browser-sdk.py
      - workflows/build/flatpak/assets/scripts/prepare-flatpak-browser-sdk.py
      - workflows/build/flatpak/tests/test_prepare_flatpak_browser_sdk.py
      - workflows/dependencies/browser-sdk/tests/test_prepare_browser_sdk.py
      - workflows/build/launcher-sdk/assets/scripts/build.py
      - workflows/publish/launcher-sdk/assets/scripts/publish.py
      - .github/workflows/launcher-sdk-candidate.yml

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3-venv libgl1-mesa-dev \
            libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxcomposite-dev libxrender-dev libxres-dev libxext-dev \
            libxcb1-dev libnss3 libasound2 libopus0 libminizip1
      - name: Install matching Qt SDK
        run: python3 workflows/shared/launch.py workflows/build/desktop/install-linux-qt.yml -- "$RUNNER_TEMP/Qt"
      - name: Qualify SDK archive producer
        run: |
          python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml -- --suite workflows/dependencies/browser-sdk/tests --pattern test_prepare_browser_sdk.py
          python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml -- --suite workflows/dependencies/browser-sdk/tests --pattern test_browser_runtime.py
          python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml -- --suite workflows/build/launcher-sdk/tests --pattern test_launcher_sdk_producer.py
          python3 workflows/shared/launch.py workflows/ci/workflow-contracts/config.yml -- --suite workflows/publish/launcher-sdk/tests --pattern test_publish_launcher_sdk.py
      - name: Prepare the exact attested Browser SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 workflows/shared/launch.py workflows/dependencies/browser-sdk/config.yml -- --lock workflows/dependencies/browser-sdk/assets/spatialweb-browser.lock.json \
            --platform linux-amd64 --output "$RUNNER_TEMP/browser-sdk"
      - name: Build and qualify relocated SDK
        run: |
          python3 workflows/shared/launch.py workflows/build/launcher-sdk/config.yml -- \
            --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --qt-root "$RUNNER_TEMP/Qt/6.10.3/gcc_64" --browser-sdk "$RUNNER_TEMP/browser-sdk" \
            --work-directory "$RUNNER_TEMP/launcher-sdk-build" \
            --output "$RUNNER_TEMP/launcher-sdk" --jobs 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-sdk-linux-amd64
          path: ${{ runner.temp }}/launcher-sdk/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher-sdk-linux-amd64
          path: ${{ runner.temp }}/launcher-sdk
      - name: Attest qualified SDK
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/launcher-sdk/*.tar.gz
            ${{ runner.temp }}/launcher-sdk/sdk-files.json
            ${{ runner.temp }}/launcher-sdk/sdk-release.json
      - name: Publish immutable SDK candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflows/shared/launch.py workflows/publish/launcher-sdk/config.yml -- --directory "$RUNNER_TEMP/launcher-sdk"
