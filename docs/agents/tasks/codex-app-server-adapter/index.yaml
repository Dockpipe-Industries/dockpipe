  - {path: history-linux-foundation.md, role: closed Linux VM foundation evidence}
  - {path: history-linux-promotion.md, role: closed Linux VM promotion evidence}
  - {path: history-linux-gates.md, role: closed Linux VM gate evidence}

maintenance:
  - Resolve document paths relative to this index; never load every history route by default.
  - Closed evidence grants no fresh authority.
  - Keep dispatch metadata synchronized with docs/agents/task-index.yaml.
