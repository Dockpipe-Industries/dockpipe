# TASK-013 Codex App Server adapter for top-level orchestrators
schema: 1
id: TASK-013
topic: Codex App Server adapter for top-level orchestrators
entrypoint: overview.md

dispatch:
  readiness: unclassified
  ownership: unclaimed

routes:
  orientation:
    read: [overview.md]
  active_backlog:
    read: [overview.md, backlog-cas01-13.md, backlog-cas14.md, acceptance-gates.md]
  reconciliation_decision:
    read: [overview.md, reconciliation-decision.md, reconciliation-plan.md]
  storage_decision:
    read:
      - overview.md
      - storage-policy.md
      - storage-matrix-gates.md
      - sqlite-reconsideration.md
      - sqlite-selection.md
  closed_cas14_evidence:
    read:
      - history-cas14-foundation.md
      - history-cas14-policy.md
      - history-cas14-routing.md
      - history-pipeon-approval.md
      - history-pipeon-input-controller.md
      - history-pipeon-cancellation.md
  closed_store_evidence:
