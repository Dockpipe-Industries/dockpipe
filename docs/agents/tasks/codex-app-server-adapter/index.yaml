      - history-store-windows-smoke.md
      - history-store-windows-boundaries.md
      - history-store-linux-smoke.md
      - history-store-linux-contention.md
      - history-store-linux-boundaries.md
  closed_vm_evidence:
    read:
      - history-linux-foundation.md
      - history-linux-promotion.md
      - history-linux-gates.md

documents:
  - {path: overview.md, role: epic status, scope, boundaries, rollback, and acceptance}
  - {path: backlog-cas01-13.md, role: CAS-01 through CAS-13 backlog}
  - {path: backlog-cas14.md, role: CAS-14 maintainer decision packet}
  - {path: reconciliation-decision.md, role: post-reconciliation product and storage decision}
  - {path: reconciliation-plan.md, role: accepted post-reconciliation implementation plan}
  - {path: storage-policy.md, role: pre-Slice-2 storage research and platform policy}
  - {path: storage-matrix-gates.md, role: platform matrix, evidence protocol, and open gates}
  - {path: sqlite-reconsideration.md, role: bounded SQLite reconsideration}
  - {path: sqlite-selection.md, role: authorized SQLite baseline and evidence matrix}
  - {path: acceptance-gates.md, role: remaining cross-platform evidence and acceptance gates}
  - {path: impact-map.md, role: likely impact map}
  - {path: history-cas14-foundation.md, role: closed CAS-14 foundation evidence}
  - {path: history-cas14-policy.md, role: closed CAS-14 policy evidence}
  - {path: history-cas14-routing.md, role: closed CAS-14 routing evidence}
  - {path: history-pipeon-approval.md, role: closed Pipeon approval evidence}
  - {path: history-pipeon-input-controller.md, role: closed Pipeon input and controller evidence}
  - {path: history-pipeon-cancellation.md, role: closed Pipeon cancellation evidence}
  - {path: history-store-windows-smoke.md, role: closed Windows store smoke evidence}
  - {path: history-store-windows-boundaries.md, role: closed Windows store boundary evidence}
  - {path: history-store-linux-smoke.md, role: closed Linux store smoke evidence}
