maintenance:
- Keep tasks open-only and core-owned; external_backlogs route independent owners without claiming their
  work.
- Dispatch describes readiness, not authorization or a persistent agent session. Clear stale ownership
  claims after a session ends.
- Keep detailed state and completed milestones in the owning task; use the smallest relevant route.
- Close only accepted work or explicit cancellation/supersession; preserve proof limits and successors
  in closed history.
- Deferred proposals stay deferred until selected; moving ownership does not complete or activate them.
