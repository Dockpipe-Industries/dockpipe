maintenance:
  - Treat this YAML file as the AI/backlog entrypoint.
  - Keep this index open-only; do not list closed items here.
  - Point every active task at its task-local YAML index; keep only dispatch readiness and ownership
    metadata in this global index.
  - Keep small tasks in one overview and split only independently loadable branches; route to the
    smallest sufficient files and do not concatenate task folders by default.
  - Move completed task files to docs/agents/tasks/closed/ with a short shipped summary and completion date.
  - When work materially completes or advances one of these items, update this index if needed and
    update the corresponding task file in the same change.
