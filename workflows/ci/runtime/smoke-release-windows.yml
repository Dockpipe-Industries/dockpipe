name: smoke-release-windows
description: Run the smoke release windows phase using explicit CI inputs.
docker_preflight: false
steps:
  - id: run
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/shared/run.py python3 workflows/ci/runtime/assets/scripts/native-smoke.py src/bin/dockpipe.exe
