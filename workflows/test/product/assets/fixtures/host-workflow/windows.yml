name: product-host-fixture
description: Observable Windows host output, failure and cleanup behavior for the authored product journey.
platforms: [windows]
vault: none
docker_preflight: false
steps:
  - id: produce
    kind: host
    cwd: artifacts
    run: assets/scripts/produce.ps1
    outputs: values.env
  - id: consume
    kind: host
    cwd: artifacts
    run: assets/scripts/consume.ps1
  - id: after
    kind: host
    cwd: artifacts
    run: assets/scripts/after.ps1
finally:
  - id: cleanup
    kind: host
    cwd: artifacts
    run: assets/scripts/cleanup.ps1
