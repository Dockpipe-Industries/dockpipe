# Native HTTP report; keep the original URL for already loaded DSM windows.
# The exact location takes precedence over DSM's generic CGI dispatcher.
location = /webman/3rdparty/dockpipe-host-qualification/host-auth.cgi {
    if ($scheme != "https") {
        return 403;
    }

    proxy_pass http://127.0.0.1:38140/report;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Dockpipe-Remote-Addr $remote_addr;
    proxy_set_header X-Dockpipe-Server-Addr $server_addr;
    proxy_set_header X-Dockpipe-Server-Port $server_port;
    proxy_set_header X-Dockpipe-Scheme $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    access_log off;
}
