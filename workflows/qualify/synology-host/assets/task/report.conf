# Verify the package endpoint before forwarding the current DSM session.
location = /webman/3rdparty/dockpipe-host-task-qualification/host-auth.cgi {
    if ($scheme != "https") {
        return 403;
    }

    client_max_body_size 8k;
    client_body_timeout 5s;
    proxy_pass https://127.0.0.1:38142/report;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /var/packages/dockpipe-host-task-qualification/var/endpoint-public/ca.pem;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_ssl_verify_depth 1;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Dockpipe-Remote-Addr $remote_addr;
    proxy_set_header X-Dockpipe-Server-Addr $server_addr;
    proxy_set_header X-Dockpipe-Server-Port $server_port;
    proxy_set_header X-Dockpipe-Scheme $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    access_log off;
}
