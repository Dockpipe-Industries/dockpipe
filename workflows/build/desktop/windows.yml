name: build-desktop-windows
description: Run the build desktop windows operation with explicit options after --.
docker_preflight: false
steps:
  - id: run
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/shared/run.py pwsh -NoProfile -File workflows/build/desktop/assets/scripts/build-windows.ps1
