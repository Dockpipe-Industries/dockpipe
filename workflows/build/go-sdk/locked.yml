name: reproduce-locked-go-sdk
description: Reproduce the exact SDK selected by workflows/build/go-sdk/assets/source.lock.json.
docker_preflight: false
steps:
  - id: reproduce
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/build/go-sdk/assets/scripts/build-locked.py
