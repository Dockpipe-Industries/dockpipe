name: build-flatpak-catalog
description: Run the build flatpak catalog operation with explicit options after --.
docker_preflight: false
steps:
  - id: run
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/shared/run.py python3 workflows/build/flatpak/assets/scripts/build-catalog.py
