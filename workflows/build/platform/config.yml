name: build-platform-release
description: Build the standalone CLI, assemble release archives, then package native Linux inputs.
docker_preflight: false
steps:
  - id: build-and-package
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/shared/run.py python3 workflows/build/platform/assets/scripts/run.py
