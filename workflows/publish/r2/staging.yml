name: staging
description: Verify immutable runtime payloads before publishing ordered release metadata.
docker_preflight: false
steps:
  - id: bootstrap
    kind: host
    cwd: repo
    outputs: bootstrap.env
    cmd: python3 workflows/publish/r2/assets/scripts/bootstrap.py
  - id: prepare
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    outputs: publication.env
    cmd: python3 workflows/publish/r2/assets/scripts/publish-r2.py --phase prepare --staging
  - id: payloads
    workflow: dockpipe.cloudflare.r2bulk
    package: dockpipe-cloudflare
  - id: metadata
    kind: host
    cwd: repo
    cmd: python3 workflows/publish/r2/assets/scripts/publish-r2.py --phase metadata
