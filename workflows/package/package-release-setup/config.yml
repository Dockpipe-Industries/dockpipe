name: package-release-setup
title: Configure package publishing
catalog_type: workflow
categories: [publishing, secrets]
description: Prepare the private settings and secret references needed to publish package releases.
platforms: [deb, macos, windows]
vault: environment
docker_preflight: false
vars:
  RELEASE_SETUP_REPOSITORY: "" # Required: owner/repository receiving the scoped secrets.
  RELEASE_SETUP_ENVIRONMENT: "release"
  RELEASE_SETUP_APPLY: "0"
  R2_ENDPOINT_URL: "" # Required: your HTTPS S3-compatible endpoint.
  DOCKPIPE_RELEASE_BUCKET: "" # Required: your publication bucket.
  R2_PREFIX: "packages"
steps:
  - id: configure-release
    kind: host
    cwd: repo
    run: assets/scripts/configure-release.sh
