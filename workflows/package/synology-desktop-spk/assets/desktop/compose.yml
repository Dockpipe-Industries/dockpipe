services:
  dockpipe:
    build:
      context: .
    platform: linux/@ARCH@
    environment:
      TITLE: Dockpipe
    volumes:
      - /var/packages/dockpipe-desktop/home:/run/dockpipe-package:ro
      - /var/packages/dockpipe-desktop/var:/config
    ports:
      - "38139:3001"
    shm_size: 1gb
    restart: unless-stopped
