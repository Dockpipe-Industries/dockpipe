# Package-owned DSM server location. No global headers or browser policies change.
location ^~ /webman/3rdparty/dockpipe-desktop/desktop/ {
    if ($scheme != "https") {
        return 403;
    }

    # With no URI suffix, proxy_pass preserves Selkies' configured subfolder.
    proxy_pass https://127.0.0.1:38139;
    # Only this fixed loopback endpoint uses the package-generated certificate.
    proxy_ssl_verify off;
    proxy_set_header Host $http_host;
    # DSM session cookies are not credentials for this independently authenticated service.
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
