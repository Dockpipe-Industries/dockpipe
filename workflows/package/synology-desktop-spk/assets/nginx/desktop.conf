# The package gateway owns DSM authentication and the private streaming credential.
location = /webman/3rdparty/dockpipe-desktop/native-host.cgi {
    if ($scheme != "https") {
        return 403;
    }

    client_max_body_size 8k;
    proxy_pass https://127.0.0.1:38143;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /var/packages/dockpipe-desktop/etc/native-host/endpoint-public/ca.pem;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Syno-Token $http_x_syno_token;
    proxy_set_header X-Dockpipe-Remote-Addr $remote_addr;
    proxy_set_header X-Dockpipe-Server-Addr $server_addr;
    proxy_set_header X-Dockpipe-Server-Port $server_port;
    proxy_set_header X-Dockpipe-Scheme $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_buffering off;
}

location ^~ /webman/3rdparty/dockpipe-desktop/desktop/ {
    if ($scheme != "https") {
        return 403;
    }

    # No URI suffix: preserve the desktop subfolder and WebSocket request path.
    proxy_pass https://127.0.0.1:38143;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /var/packages/dockpipe-desktop/etc/native-host/endpoint-public/ca.pem;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Syno-Token $http_x_syno_token;
    proxy_set_header X-Dockpipe-Remote-Addr $remote_addr;
    proxy_set_header X-Dockpipe-Server-Addr $server_addr;
    proxy_set_header X-Dockpipe-Server-Port $server_port;
    proxy_set_header X-Dockpipe-Scheme $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_connect_timeout 2s;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
