name: package-store-staging-infra
title: Plan staging package infrastructure
catalog_type: workflow
categories: [infrastructure, publishing]
description: Prepare a Terraform plan for an explicitly configured staging package store. Applying the saved plan is a separate action.
platforms: [deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Requires Bash 4.2 or newer; use Homebrew Bash on macOS.
      install:
        deb: sudo apt-get install -y bash
        macos: brew install bash
    - id: terraform
      command: terraform
      description: Required to prepare the staging infrastructure plan.
      install:
        deb: sudo apt-get install -y terraform
        macos: brew install hashicorp/tap/terraform
vault: op
docker_preflight: false
vars:
  STAGING_R2_BUCKET: "" # Required: your staging publication bucket.
  STAGING_PUBLIC_HOSTNAME: "" # Required: your staging hostname.
  STAGING_TF_STATE_BUCKET: "" # Required: a private state bucket.
  STAGING_TF_STATE_KEY: "" # Required: a staging-only state object key.
steps:
  - id: staging-infrastructure
    kind: host
    cwd: repo
    run: assets/scripts/plan-staging.sh
