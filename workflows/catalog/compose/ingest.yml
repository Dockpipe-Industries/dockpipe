name: ingest-catalog
description: Run the ingest catalog operation with explicit options after --.
docker_preflight: false
steps:
  - id: run
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    cmd: python3 workflows/shared/run.py python3 workflows/catalog/compose/assets/scripts/ingest-pinned-stores.py
