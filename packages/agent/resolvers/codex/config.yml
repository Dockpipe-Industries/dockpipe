# Bundled workflow for resolver codex and DOCKPIPE_RESOLVER_WORKFLOW=codex.
# Used after worktree strategy clone; parent runs commit-worktree on the host.
name: codex
title: Codex CLI integration
catalog_type: integration
categories: [ai, development]
description: Run the Codex CLI through a Dockpipe-managed container. Requires Docker and your own OpenAI authentication.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: docker
      command: docker
      description: Required to run the Codex resolver image.
      install:
        windows: winget install Docker.DockerDesktop
        deb: sudo apt-get update && sudo apt-get install -y docker.io docker-compose-plugin
        macos: brew install --cask docker

image:
  packages:
    apt: []

steps:
  - id: codex
    isolate: codex
