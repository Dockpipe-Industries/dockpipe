# Bundled workflow for resolver claude and DOCKPIPE_RESOLVER_WORKFLOW=claude.
# Used after worktree strategy clone; parent runs commit-worktree on the host.
name: claude
title: Claude Code integration
catalog_type: integration
categories: [ai, development]
description: Run Claude Code through a Dockpipe-managed container. Requires Docker and your own Claude authentication.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: docker
      command: docker
      description: Required to run the Claude resolver image.
      install:
        windows: winget install Docker.DockerDesktop
        deb: sudo apt-get update && sudo apt-get install -y docker.io docker-compose-plugin
        macos: brew install --cask docker

image:
  packages:
    apt: []

steps:
  - id: claude
    isolate: claude
    resolver: claude
