name: codex.cli.update
title: Update Codex CLI
catalog_type: workflow
categories: [ai, maintenance]
namespace: dockpipeproject
description: Update your installed Codex CLI through npm after approval, then verify its App Server schema.
docker_preflight: false
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Runs the package-owned Codex CLI update wrapper. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash
    - id: npm
      command: npm
      description: Installs the current Codex CLI package.
      install:
        windows: winget install OpenJS.NodeJS.LTS
        deb: sudo apt-get update && sudo apt-get install -y nodejs npm
        macos: brew install node
    - id: codex
      command: codex
      description: The host Codex CLI used for App Server sessions.
      install:
        windows: npm install --global @openai/codex@latest
        deb: sudo npm install --global @openai/codex@latest
        macos: npm install --global @openai/codex

steps:
  - id: update
    kind: host
    run: scripts/dorkpipe/codex-cli-update.sh
