schema: 1
kind: workflow
name: software.dev
title: Assisted software development
catalog_type: workflow
categories: [ai, development]
version: 0.6.1
description: Plan development work, run configured AI workers, and review their proposed changes before applying them.
author: Dockpipe
license: Apache-2.0
repository: https://github.com/Dockpipe-Industries/dockpipe
tags: [workflow, dorkpipe, software-development, orchestration]
depends: [dorkpipe]
platforms: [windows, deb]
dependencies:
  host:
    - id: bash
      command: bash
      description: Runs package-owned orchestration scripts.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
    - id: git
      command: git
      description: Reads repository state and applies approved materialized artifacts.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y git
allow_clone: true
distribution: source
