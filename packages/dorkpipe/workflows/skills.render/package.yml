schema: 1
kind: workflow
name: skills.render
title: Export agent skills
catalog_type: workflow
categories: [ai, development]
version: 0.6.1
min_dockpipe_version: 0.6.14
description: Export the packaged agent skills for your selected coding assistant.
author: Dockpipe
license: Apache-2.0
repository: https://github.com/Dockpipe-Industries/dockpipe
tags: [workflow, dorkpipe, skills, codex, claude]
depends: [dorkpipe]
requires_resolvers: [dorkpipe]
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Runs the skills render wrapper script. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash
    - id: go
      command: go
      description: Builds the skills-render helper from source when no compiled helper is present.
      install:
        windows: winget install GoLang.Go
        deb: sudo apt-get update && sudo apt-get install -y golang-go
        macos: brew install go
allow_clone: true
distribution: source
