# Host-only: normalize DorkPipe package-scope analysis/queue.json → insights.json via the dorkpipe CLI.
name: user-insight-process
title: Process user feedback
catalog_type: workflow
categories: [documentation]
description: Process recorded user feedback and export the results by category.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Required to run the packaged user-insight scripts. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash

docker_preflight: false
steps:
  - id: process
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    run:
      - scripts/dorkpipe/user-insight-process.sh
  - id: export
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    run:
      - scripts/dorkpipe/user-insight-export-by-category.sh
