# Internal workflow (this repo + copies): host script prints compliance/security *signal* paths for AI assistants.
# Not a Dockpipe core primitive — Dockpipe is the user; workflows/scripts are the extension surface (AGENTS.md).
# runtime: dockerimage (host steps use kind: host; docker_preflight skips socket check for run:).
name: compliance-handoff
title: Compliance review handoff
catalog_type: workflow
categories: [documentation, security]
description: Prepare a structured handoff for review from the selected DorkPipe evidence. Does not certify compliance.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Required to run the packaged compliance handoff script. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash

docker_preflight: false
steps:
  - id: handoff
    kind: host
    cwd: repo
    scopes:
      source: repo
      artifacts: artifacts
    run:
      - scripts/dorkpipe/compliance-handoff.sh
