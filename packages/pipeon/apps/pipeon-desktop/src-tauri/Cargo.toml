[package]
name = "pipeon-desktop"
version = "0.6.0"
edition = "2021"
description = "Pipeon desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
serde_json = "1"
tauri = { version = "2.12.3", features = [] }
url = "2"

[dev-dependencies]
tauri = { version = "2.12.3", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# GTK 0.18 requires glib 0.18. Keep the upstream security fix until the
# Linux desktop stack supports a patched registry release. See vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

# RUSTSEC-2024-0429 manifests when the affected library is optimized.
[profile.test.package.glib]
opt-level = 3
