schema: 1
kind: package
name: secrets
version: 0.6.1
title: Dockpipe secrets resolvers
platforms: [windows, deb, macos]
description: |
  Umbrella package for secret-store and vault-style resolver profiles. Each resolver under
  resolvers/ is optional at install time (e.g. onepassword for 1Password CLI workflows).
author: Dockpipe
license: Apache-2.0
repository: https://github.com/Dockpipe-Industries/dockpipe
tags: [resolver, secrets, vault]
includes_resolvers:
  - onepassword
  - aws-secretsmanager
  - azure-keyvault
  - infisical
build:
  source:
    script: assets/scripts/build-source.sh
test:
  script: tests/run.sh
script_contract:
  inject: [workdir, workflow_name, script_dir, package_root, assets_dir, dockpipe_bin]
