# Maintainer workflow: secretstore with 1Password CLI (op). Not part of lean src/core bundle
# discovery for downstream installs — use in this repo or after packaging this resolver tree.
name: secretstore-onepassword
title: Run with 1Password secrets
catalog_type: workflow
categories: [secrets]
workflow_type: secretstore
description: Run a host command with environment values supplied by 1Password references. Requires the 1Password CLI and your vault access.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Required to run the 1Password secretstore wrapper script. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash
    - id: op
      command: op
      description: Required to inject secrets from 1Password.
      install:
        windows: winget install AgileBits.1Password.CLI
        deb: sudo apt-get update && sudo apt-get install -y 1password-cli
        macos: brew install --cask 1password-cli

docker_preflight: false

types:
  - models/ISecretstoreOnepasswordConfig

vars:
  SECRETSTORE_PROVIDER: "op"
  OP_ENV_FILE: ".env.op.template"

steps:
  - id: exec-with-secrets
    kind: host
    run:
      - ../assets/scripts/secretstore-op-exec.sh
