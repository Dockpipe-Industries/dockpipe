name: dockpipe.cloudflare.r2infra
title: Cloudflare R2 infrastructure
catalog_type: workflow
categories: [infrastructure, storage]
namespace: dockpipe-cloudflare
description: Plan or apply Terraform configuration for Cloudflare R2 storage. Requires your own Cloudflare credentials and explicit infrastructure settings.
platforms: [windows, deb, macos]
dependencies:
  host:
    - id: bash
      command: bash
      description: Required to run the Cloudflare R2 Terraform wrapper. On macOS, use Homebrew Bash 4.2+ on PATH.
      install:
        windows: winget install Git.Git
        deb: sudo apt-get update && sudo apt-get install -y bash
        macos: brew install bash
    - id: terraform
      command: terraform
      description: Required to provision Cloudflare R2 infrastructure.
      install:
        windows: winget install Hashicorp.Terraform
        deb: sudo apt-get update && sudo apt-get install -y terraform
        macos: brew install hashicorp/tap/terraform

types:
  - models/IR2InfraConfig

docker_preflight: false

vars:
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_API_TOKEN: ""
  R2_BUCKET: ""
  DOCKPIPE_TF_BACKEND: "local"
  DOCKPIPE_TF_COMMANDS: ""
  DOCKPIPE_TF_DRY_RUN: "0"
  TF_VAR_public_hostname: "packages.example.com"
  TF_VAR_r2_custom_domain_min_tls: "1.2"
  TF_VAR_zone_id: "REPLACE_WITH_CLOUDFLARE_ZONE_ID"

steps:
  - id: terraform
    kind: host
    run:
      - assets/scripts/terraform-cloudflare-r2-run.sh
