<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dockpipe hardware-key pairing</title>
<style>
body { font: 17px system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 1.5rem; line-height: 1.5; }
button { font: inherit; padding: .75rem 1rem; cursor: pointer; }
#details { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1 id="title">Dockpipe hardware-key pairing</h1>
<p>Use your physical security key. Check the machine names, fingerprints and pairing code before continuing.</p>
<p id="details"></p>
<button id="verify" disabled>Verify security key</button>
<p id="status" role="status">Preparing verification…</p>
<script>
"use strict";
const token = location.hash.slice(1);
history.replaceState(null, "", "/");
const button = document.getElementById("verify");
const status = document.getElementById("status");
let ceremony;

function decode(value) {
  const binary = atob(value.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(binary, character => character.charCodeAt(0));
}

function encode(value) {
  const bytes = new Uint8Array(value);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function call(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Dockpipe-Ceremony": token },
    body: JSON.stringify(body),
    credentials: "omit",
    redirect: "error"
  });
  if (!response.ok) throw new Error("Verification was rejected. Check the Dockpipe CLI and start again.");
  return response.json();
}

async function prepare() {
  ceremony = await call("/options", null);
  document.getElementById("title").textContent = ceremony.title;
  document.getElementById("details").textContent = ceremony.details;
  button.textContent = ceremony.kind === "create" ? "Register physical security key" : "Verify security key";
  button.disabled = false;
  status.textContent = "Ready. Your key may ask for its PIN and a touch.";
}

button.addEventListener("click", async () => {
  button.disabled = true;
  try {
    const publicKey = ceremony.options.publicKey;
    publicKey.challenge = decode(publicKey.challenge);
    if (publicKey.user) publicKey.user.id = decode(publicKey.user.id);
    for (const descriptor of publicKey.allowCredentials || publicKey.excludeCredentials || []) {
      descriptor.id = decode(descriptor.id);
    }
    let credential;
    if (ceremony.kind === "create") credential = await navigator.credentials.create({ publicKey });
    else credential = await navigator.credentials.get({ publicKey });
    const response = { clientDataJSON: encode(credential.response.clientDataJSON) };
    if (ceremony.kind === "create") {
      response.attestationObject = encode(credential.response.attestationObject);
      if (credential.response.getTransports) response.transports = credential.response.getTransports();
    } else {
      response.authenticatorData = encode(credential.response.authenticatorData);
      response.signature = encode(credential.response.signature);
      response.userHandle = credential.response.userHandle ? encode(credential.response.userHandle) : null;
    }
    const result = await call("/finish", {
      id: credential.id,
      rawId: encode(credential.rawId),
      type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment,
      clientExtensionResults: credential.getClientExtensionResults(),
      response
    });
    if (result.next) await prepare();
    else status.textContent = "Verified. You can close this page.";
  } catch (error) {
    status.textContent = error.message;
  }
});

prepare().catch(error => { status.textContent = error.message; });
</script>
</html>
